appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "После запуска пианино занимает весь экран и забирает себе всю клавиатуру. Что бы ни нажал малыш, звучит мягкая нота пианино, и ничто не закрывает приложение, не переключает программы и не вызывает системные сочетания клавиш. У каждой клавиши своя нота: низкие внизу слева, высокие вверху справа."
exitHow: "Чтобы выйти: удерживайте мышь в правом верхнем углу экрана 3 секунды или наберите quitpiano на клавиатуре."
exitHowTyped: "Чтобы выйти: наберите quitpiano на клавиатуре."
permissionMissing: "Чтобы забрать клавиатуру, пианино нужен доступ к Универсальному доступу. Откройте настройку и включите Mash Piano — эта строка сама станет зелёной."
permissionGranted: "Пианино может забрать всю клавиатуру."
openSettings: "Открыть настройки Универсального доступа"
soundLoading: "Загружаем пианино…"
soundFailed: "Не удалось включить звук: {error}. Проверьте вывод звука и снова откройте пианино."
volume: "Громкость"
volumeLocked: "Пока малыш играет, клавиши громкости заблокированы, поэтому сначала настройте её здесь."
tryIt: "Послушать"
systemVolumeOver: "Громкость компьютера — {percent, number}%. Когда малыш начнёт, она снизится до {cap, number}%, чтобы беречь его уши."
systemVolumeOk: "Громкость компьютера — {percent, number}%, и пока малыш играет, она не превысит {cap, number}%."
systemVolumeUnknown: "Громкость этого выхода прочитать нельзя, как у HDMI и некоторых колонок. Убедитесь, что не слишком громко."
start: "Начать играть (весь экран, клавиатура заблокирована)"
secureInput: "Другое приложение включило защищённый ввод с клавиатуры, например в Терминале или в поле пароля, и тогда ни одно приложение не может заблокировать клавиатуру. Отключите его или перезагрузите компьютер и начните снова."
lockFailed: "Не удалось заблокировать клавиатуру. Проверьте, что Mash Piano включено в Системных настройках › Конфиденциальность и безопасность › Универсальный доступ; после обновления удалите старую запись (−) и добавьте её снова."
windowsLimits: "Ctrl+Alt+Del не может заблокировать ни одно приложение; Win+L заблокировано, пока малыш играет."
cornerHint: "Родителям: удерживайте правый верхний угол 3 секунды, чтобы выйти"
touchIntro: "Каждое касание или клавиша подключённой клавиатуры играет мягкую ноту пианино, и все они из одного лада, который всегда звучит красиво."
touchLockIOS: "Чтобы малыш не вышел из пианино, включите Гид-доступ: Настройки › Универсальный доступ › Гид-доступ, а затем трижды нажмите боковую кнопку, пока играет пианино."
touchLockAndroid: "Чтобы малыш не вышел из пианино, закрепите его: Настройки › Безопасность › Закрепление приложений, а затем закрепите Mash Piano в недавних приложениях."
touchStart: "Начать играть"
scale: "Ноты"
scalePentatonic: "Пять нот"
scalePentatonicNote: "До ре ми соль ля. Всегда звучит мило."
scaleMajor: "Семь нот"
scaleMajorNote: "Белые клавиши: до ре ми фа соль ля си."
scaleChromatic: "Все двенадцать"
scaleChromaticNote: "Белые и чёрные клавиши, все ноты."
visualsTitle: "Фейерверк"
visualsNote: "Цветной салют на каждую ноту. Не нужен, если малыш не видит экран."
lockMouseTitle: "Заблокировать также мышь и трекпад"
lockMouseNote: "Рекомендуется на ноутбуках. Выход — набрать quitpiano."
keyboardOn: "Клавиатура подключена"
keyboardOnNote: "Малыш играет на клавиатуре, каждая клавиша — нота, как на компьютере."
keyboardOff: "Нет клавиатуры"
keyboardOffNote: "Малыш нажимает большие цветные клавиши на экране. Подключите клавиатуру, чтобы играть на ней."
desktopApp: "Mash Piano бесплатно есть и для Mac и Windows: там малыш играет на настоящей клавиатуре компьютера, и вся клавиатура заблокирована."
desktopAppLink: "Скачать для Mac и Windows"

