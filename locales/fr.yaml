appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Une fois lancé, le piano occupe tout l’écran et prend tout le clavier. Chaque touche que bébé presse joue une douce note de piano, et rien ne quitte l’app, ne change d’application ni n’ouvre de raccourci système. Chaque touche a sa note : grave en bas à gauche, aiguë en haut à droite."
exitHow: "Pour arrêter : maintenez la souris dans le coin supérieur droit de l’écran pendant 3 secondes, ou tapez quitpiano au clavier."
exitHowTyped: "Pour arrêter : tapez quitpiano au clavier."
permissionMissing: "Le piano a besoin de l’autorisation Accessibilité pour prendre le clavier. Ouvrez le réglage et activez Mash Piano ; cette ligne passe au vert d’elle-même."
permissionGranted: "Le piano peut prendre tout le clavier."
openSettings: "Ouvrir les réglages Accessibilité"
soundLoading: "Chargement du piano…"
soundFailed: "Impossible de démarrer le son : {error}. Vérifiez la sortie audio, puis rouvrez le piano."
volume: "Volume"
volumeLocked: "Les touches de volume du clavier sont verrouillées pendant que bébé joue : réglez-le d’abord ici."
tryIt: "Essayer"
systemVolumeOver: "Le volume de l’ordinateur est à {percent, number} %. Il descend à {cap, number} % quand bébé commence, pour protéger ses oreilles."
systemVolumeOk: "Le volume de l’ordinateur est à {percent, number} % et reste à {cap, number} % ou moins pendant que bébé joue."
systemVolumeUnknown: "Le volume de cette sortie ne peut pas être lu, comme avec le HDMI et certaines enceintes. Vérifiez qu’il n’est pas trop fort."
start: "Commencer à jouer (plein écran, clavier verrouillé)"
secureInput: "Une autre app a activé la saisie sécurisée au clavier, comme celle du Terminal ou un champ de mot de passe, et aucune app ne peut alors verrouiller le clavier. Désactivez-la ou redémarrez l’ordinateur, puis recommencez."
lockFailed: "Le clavier n’a pas pu être verrouillé. Vérifiez que Mash Piano est activé dans Réglages Système › Confidentialité et sécurité › Accessibilité ; après une mise à jour, supprimez l’ancienne entrée (−) et ajoutez-la à nouveau."
windowsLimits: "Aucune app ne peut bloquer Ctrl+Alt+Suppr ; Win+L est bloqué pendant que bébé joue."
cornerHint: "Parents : maintenez le coin supérieur droit 3 secondes pour arrêter"
touchIntro: "Chaque toucher, ou chaque touche d’un clavier branché, joue une douce note de piano, toutes dans une gamme qui sonne toujours juste."
touchLockIOS: "Pour garder bébé dans le piano, activez l’Accès guidé : Réglages › Accessibilité › Accès guidé, puis cliquez trois fois sur le bouton latéral pendant que le piano joue."
touchLockAndroid: "Pour garder bébé dans le piano, épinglez-le : Paramètres › Sécurité › Épinglage d’application, puis épinglez Mash Piano depuis les applis récentes."
touchStart: "Commencer à jouer"
scale: "Notes"
scalePentatonic: "Cinq notes"
scalePentatonicNote: "Do ré mi sol la. Toujours joli."
scaleMajor: "Sept notes"
scaleMajorNote: "Les touches blanches, do ré mi fa sol la si."
scaleChromatic: "Les douze"
scaleChromaticNote: "Touches blanches et noires, toutes les notes."
visualsTitle: "Feux d’artifice"
visualsNote: "Une gerbe de couleurs pour chaque note. Inutile si bébé ne voit pas l’écran."
noteNamesTitle: Noms des notes sur les touches
noteNamesNote: Affiche C D E F G A B sur chaque touche, pour apprendre les notes ensemble.
lockMouseTitle: "Verrouiller aussi la souris et le trackpad"
lockMouseNote: "Conseillé sur les portables. Arrêtez alors en tapant quitpiano."
keyboardOn: "Clavier connecté"
keyboardOnNote: "Bébé joue sur le clavier, une note par touche, comme sur un ordinateur."
keyboardOff: "Pas de clavier"
keyboardOffNote: "Bébé touche les grandes touches colorées à l’écran. Branchez un clavier pour jouer dessus."
desktopApp: "Mash Piano est aussi gratuit sur Mac et Windows : bébé joue sur un vrai clavier d’ordinateur, entièrement verrouillé."
desktopAppLink: "Télécharger pour Mac et Windows"

