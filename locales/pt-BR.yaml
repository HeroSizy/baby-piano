appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Ao começar, o piano ocupa a tela inteira e assume todo o teclado. Qualquer tecla que o bebê aperte toca uma nota suave de piano, e nada fecha o app, troca de aplicativo ou abre atalhos do sistema. Cada tecla tem sua nota: grave embaixo à esquerda e aguda em cima à direita."
exitHow: "Para sair: segure o mouse no canto superior direito da tela por 3 segundos ou digite quitpiano no teclado."
exitHowTyped: "Para sair: digite quitpiano no teclado."
permissionMissing: "O piano precisa da permissão de Acessibilidade para assumir o teclado. Abra o ajuste e ative o Mash Piano; esta linha fica verde sozinha."
permissionGranted: "O piano pode assumir todo o teclado."
openSettings: "Abrir ajustes de Acessibilidade"
soundLoading: "Carregando o piano…"
soundFailed: "Não foi possível iniciar o som: {error}. Verifique a saída de som e abra o piano de novo."
volume: "Volume"
volumeLocked: "As teclas de volume do teclado ficam bloqueadas enquanto o bebê toca, então ajuste aqui primeiro."
tryIt: "Testar"
systemVolumeOver: "O volume do computador está em {percent, number}%. Ele cai para {cap, number}% quando o bebê começa, para proteger os ouvidos."
systemVolumeOk: "O volume do computador está em {percent, number}% e fica em {cap, number}% ou menos enquanto o bebê toca."
systemVolumeUnknown: "Não é possível ler o volume desta saída, como no HDMI e em algumas caixas de som. Confira se não está alto demais."
start: "Começar a tocar (tela cheia, teclado bloqueado)"
secureInput: "Outro app ativou a entrada segura de teclado, como a do Terminal ou um campo de senha, e assim nenhum app consegue bloquear o teclado. Desative-a ou reinicie o computador e comece de novo."
lockFailed: "Não foi possível bloquear o teclado. Verifique se o Mash Piano está ativado em Ajustes do Sistema › Privacidade e Segurança › Acessibilidade; depois de uma atualização, remova o item antigo (−) e adicione-o de novo."
windowsLimits: "Nenhum app consegue bloquear Ctrl+Alt+Del; Win+L fica bloqueado enquanto o bebê toca."
cornerHint: "Pais: segurem o canto superior direito por 3 segundos para sair"
touchIntro: "Cada toque, ou cada tecla de um teclado conectado, toca uma nota suave de piano, todas numa escala que sempre soa bem junta."
touchLockIOS: "Para manter o bebê no piano, ative o Acesso Guiado: Ajustes › Acessibilidade › Acesso Guiado e clique três vezes no botão lateral enquanto o piano toca."
touchLockAndroid: "Para manter o bebê no piano, fixe o app: Configurações › Segurança › Fixar app e fixe o Mash Piano nos apps recentes."
touchStart: "Começar a tocar"
scale: "Notas"
scalePentatonic: "Cinco notas"
scalePentatonicNote: "Dó ré mi sol lá. Sempre soa bonito."
scaleMajor: "Sete notas"
scaleMajorNote: "As teclas brancas, dó ré mi fá sol lá si."
scaleChromatic: "Todas as doze"
scaleChromaticNote: "Teclas brancas e pretas, todas as notas."
visualsTitle: "Fogos de artifício"
visualsNote: "Uma explosão colorida a cada nota. Não precisa se o bebê não vê a tela."
lockMouseTitle: "Bloquear também o mouse e o trackpad"
lockMouseNote: "Recomendado em notebooks. Para sair, digite quitpiano."
keyboardOn: "Teclado conectado"
keyboardOnNote: "O bebê toca no teclado, cada tecla uma nota, como num computador."
keyboardOff: "Sem teclado"
keyboardOffNote: "O bebê toca nas teclas grandes e coloridas da tela. Conecte um teclado para tocar nele."
desktopApp: "O Mash Piano também é grátis para Mac e Windows, onde o bebê toca num teclado de computador de verdade e o teclado inteiro fica bloqueado."
desktopAppLink: "Baixar para Mac e Windows"

