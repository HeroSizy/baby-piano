appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Başladığında piyano tüm ekranı kaplar ve klavyenin tamamını devralır. Bebek hangi tuşa basarsa bassın yumuşak bir piyano notası çalar; hiçbir şey uygulamayı kapatmaz, uygulama değiştirmez ya da sistem kısayollarını açmaz. Her tuşun kendi notası vardır: pesler sol altta, tizler sağ üstte."
exitHow: "Durdurmak için: fareyi ekranın sağ üst köşesinde 3 saniye basılı tutun ya da klavyede quitpiano yazın."
exitHowTyped: "Durdurmak için: klavyede quitpiano yazın."
permissionMissing: "Piyanonun klavyeyi devralması için Erişilebilirlik izni gerekir. Ayarı açın ve Mash Piano’yu etkinleştirin; bu satır kendiliğinden yeşile döner."
permissionGranted: "Piyano klavyenin tamamını devralabilir."
