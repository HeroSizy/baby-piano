appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Nach dem Start füllt das Klavier den Bildschirm und übernimmt die ganze Tastatur. Was das Baby auch drückt, es erklingt ein sanfter Klavierton, und nichts beendet die App, wechselt Programme oder öffnet Systemkurzbefehle. Jede Taste hat ihren eigenen Ton, tief unten links und hoch oben rechts."
exitHow: "Zum Beenden: die Maus 3 Sekunden in der oberen rechten Bildschirmecke gedrückt halten oder auf der Tastatur quitpiano tippen."
exitHowTyped: "Zum Beenden: auf der Tastatur quitpiano tippen."
permissionMissing: "Das Klavier braucht die Berechtigung für Bedienungshilfen, um die Tastatur zu übernehmen. Öffne die Einstellung und schalte Mash Piano ein; diese Zeile wird dann von selbst grün."
permissionGranted: "Das Klavier darf die ganze Tastatur übernehmen."
openSettings: "Einstellungen für Bedienungshilfen öffnen"
soundLoading: "Klavier wird geladen …"
soundFailed: "Der Ton konnte nicht starten: {error}. Prüfe die Tonausgabe und öffne das Klavier dann erneut."
volume: "Lautstärke"
volumeLocked: "Die Lautstärketasten der Tastatur sind gesperrt, während das Baby spielt – stelle sie also zuerst hier ein."
tryIt: "Ausprobieren"
output: "Tonausgabe"
outputPlayingOn: "Spielt über {device}"
outputChoose: "Wählen, wo der Ton spielt"
outputNote: "Kopfhörer, ein Bluetooth-Lautsprecher oder AirPlay: Tippe auf die Taste, um zu wechseln."
systemVolumeOver: "Die Lautstärke des Computers ist {percent, number} %. Zum Schutz der Ohren sinkt sie auf {cap, number} %, wenn das Baby loslegt."
systemVolumeOk: "Die Lautstärke des Computers ist {percent, number} % und bleibt beim Spielen bei höchstens {cap, number} %."
systemVolumeUnknown: "Die Lautstärke dieser Ausgabe lässt sich nicht lesen, etwa bei HDMI und manchen Lautsprechern. Prüfe, dass sie nicht zu laut ist."
start: "Spielen starten (Vollbild, Tastatur gesperrt)"
secureInput: "Eine andere App hat die sichere Tastatureingabe eingeschaltet, etwa die des Terminals oder ein Passwortfeld, und dann kann keine App die Tastatur sperren. Schalte sie aus oder starte den Computer neu und starte dann erneut."
lockFailed: "Die Tastatur konnte nicht gesperrt werden. Prüfe, ob Mash Piano unter Systemeinstellungen › Datenschutz & Sicherheit › Bedienungshilfen eingeschaltet ist; entferne nach einem Update den alten Eintrag (−) und füge ihn neu hinzu."
windowsLimits: "Strg+Alt+Entf kann keine App blockieren; Win+L ist gesperrt, während das Baby spielt."
cornerHint: "Eltern: obere rechte Ecke 3 Sekunden halten zum Beenden"
touchIntro: "Jedes Tippen oder jede Taste einer angeschlossenen Tastatur spielt einen sanften Klavierton, alle in einer Tonleiter, die immer schön zusammenklingt."
touchLockIOS: "Damit das Baby im Klavier bleibt, schalte den geführten Zugriff ein: Einstellungen › Bedienungshilfen › Geführter Zugriff, und drücke dann beim Spielen dreimal die Seitentaste."
touchLockAndroid: "Damit das Baby im Klavier bleibt, fixiere es: Einstellungen › Sicherheit › Bildschirmfixierung, und fixiere dann Mash Piano in den letzten Apps."
touchStart: "Spielen starten"
scale: "Töne"
scalePentatonic: "Fünf Töne"
scalePentatonicNote: "C D E G A. Klingt immer schön."
scaleMajor: "Sieben Töne"
scaleMajorNote: "Die weißen Tasten, C D E F G A H."
scaleChromatic: "Alle zwölf"
scaleChromaticNote: "Weiße und schwarze Tasten, jeder Ton."
visualsTitle: "Feuerwerk"
visualsNote: "Ein bunter Funkenregen zu jedem Ton. Nicht nötig, wenn das Baby den Bildschirm nicht sieht."
lockMouseTitle: "Auch Maus und Trackpad sperren"
lockMouseNote: "Empfohlen für Laptops. Beenden dann durch Tippen von quitpiano."
keyboardOn: "Tastatur verbunden"
keyboardOnNote: "Das Baby spielt auf der Tastatur, jede Taste ein Ton, wie am Computer."
keyboardOff: "Keine Tastatur"
keyboardOffNote: "Das Baby tippt auf die großen bunten Tasten am Bildschirm. Schließe eine Tastatur an, um darauf zu spielen."
desktopApp: "Mash Piano gibt es auch kostenlos für Mac und Windows: Dort spielt das Baby auf einer echten Computertastatur, und die ganze Tastatur ist gesperrt."
desktopAppLink: "Für Mac und Windows laden"

