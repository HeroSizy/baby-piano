appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Når pianoet starter, fyller det skjermen og tar over hele tastaturet. Uansett hva babyen trykker på, spilles en myk pianotone, og ingenting avslutter appen, bytter program eller åpner systemsnarveier. Hver tast har sin egen tone, dyp nederst til venstre og lys øverst til høyre."
exitHow: "Slik stopper du: hold musen i skjermens øvre høyre hjørne i 3 sekunder, eller skriv quitpiano på tastaturet."
exitHowTyped: "Slik stopper du: skriv quitpiano på tastaturet."
permissionMissing: "Pianoet trenger tillatelsen Tilgjengelighet for å ta over tastaturet. Åpne innstillingen og slå på Mash Piano; denne linjen blir grønn av seg selv."
permissionGranted: "Pianoet kan ta over hele tastaturet."
openSettings: "Åpne innstillinger for Tilgjengelighet"
soundLoading: "Laster inn pianoet …"
soundFailed: "Lyden kunne ikke starte: {error}. Sjekk lydutgangen, og åpne pianoet igjen."
volume: "Volum"
volumeLocked: "Volumtastene på tastaturet er låst mens babyen spiller, så still inn volumet her først."
tryIt: "Prøv"
systemVolumeOver: "Datamaskinens volum er {percent, number} %. Det senkes til {cap, number} % når babyen begynner, for å beskytte ørene."
systemVolumeOk: "Datamaskinens volum er {percent, number} % og holder seg på {cap, number} % eller lavere mens babyen spiller."
systemVolumeUnknown: "Volumet til denne utgangen kan ikke leses, som med HDMI og noen høyttalere. Sjekk at det ikke er for høyt."
start: "Begynn å spille (fullskjerm, tastatur låst)"
secureInput: "En annen app har slått på sikker tastaturinndata, for eksempel Terminals eller et passordfelt, og da kan ingen app låse tastaturet. Slå det av, eller start datamaskinen på nytt, og begynn så igjen."
lockFailed: "Tastaturet kunne ikke låses. Sjekk at Mash Piano er slått på under Systeminnstillinger › Personvern og sikkerhet › Tilgjengelighet; etter en oppdatering fjerner du den gamle oppføringen (−) og legger den til igjen."
windowsLimits: "Ctrl+Alt+Del kan ingen app blokkere; Win+L er blokkert mens babyen spiller."
cornerHint: "Foreldre: hold øvre høyre hjørne i 3 sekunder for å stoppe"
touchIntro: "Hvert trykk, eller hver tast på et tilkoblet tastatur, spiller en myk pianotone, alle i en skala som alltid høres fin ut sammen."
touchLockIOS: "For å holde babyen i pianoet slår du på Veiledet tilgang: Innstillinger › Tilgjengelighet › Veiledet tilgang, og trykker så tre ganger på sideknappen mens pianoet spiller."
touchLockAndroid: "For å holde babyen i pianoet fester du det: Innstillinger › Sikkerhet › Festing av apper, og fester så Mash Piano fra nylige apper."
touchStart: "Begynn å spille"
scale: "Toner"
scalePentatonic: "Fem toner"
scalePentatonicNote: "Do re mi sol la. Høres alltid fint ut."
scaleMajor: "Sju toner"
scaleMajorNote: "De hvite tangentene, do re mi fa sol la si."
scaleChromatic: "Alle tolv"
scaleChromaticNote: "Hvite og svarte tangenter, hver eneste tone."
visualsTitle: "Fyrverkeri"
visualsNote: "Et fargerikt smell for hver tone. Ikke nødvendig hvis babyen ikke ser skjermen."
lockMouseTitle: "Lås også mus og styreflate"
lockMouseNote: "Anbefales på bærbare. Stopp da ved å skrive quitpiano."
keyboardOn: "Tastatur tilkoblet"
keyboardOnNote: "Babyen spiller på tastaturet, en tone per tast, som på en datamaskin."
keyboardOff: "Ingen tastatur"
keyboardOffNote: "Babyen trykker på de store fargede tangentene på skjermen. Koble til et tastatur for å spille på det."
desktopApp: "Mash Piano er også gratis for Mac og Windows, der babyen spiller på et ekte datatastatur og hele tastaturet er låst."
desktopAppLink: "Last ned for Mac og Windows"

