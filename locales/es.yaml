appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Al empezar, el piano ocupa toda la pantalla y se queda con todo el teclado. Cualquier tecla que pulse el bebé toca una nota suave de piano, y nada cierra la app, cambia de aplicación ni abre atajos del sistema. Cada tecla tiene su nota: grave abajo a la izquierda y aguda arriba a la derecha."
exitHow: "Para salir: mantén el ratón en la esquina superior derecha de la pantalla durante 3 segundos o escribe quitpiano en el teclado."
exitHowTyped: "Para salir: escribe quitpiano en el teclado."
permissionMissing: "El piano necesita el permiso de Accesibilidad para quedarse con el teclado. Abre el ajuste y activa Mash Piano; esta línea se pondrá verde sola."
permissionGranted: "El piano puede quedarse con todo el teclado."
openSettings: "Abrir ajustes de Accesibilidad"
soundLoading: "Cargando el piano…"
soundFailed: "No se pudo iniciar el sonido: {error}. Revisa la salida de sonido y vuelve a abrir el piano."
volume: "Volumen"
volumeLocked: "Las teclas de volumen se bloquean mientras el bebé toca, así que ajústalo aquí primero."
tryIt: "Probar"
systemVolumeOver: "El volumen del ordenador está al {percent, number} %. Bajará al {cap, number} % cuando empiece el bebé, para cuidar sus oídos."
systemVolumeOk: "El volumen del ordenador está al {percent, number} % y se mantiene en el {cap, number} % o menos mientras el bebé toca."
systemVolumeUnknown: "No se puede leer el volumen de esta salida, como ocurre con HDMI y algunos altavoces. Comprueba que no esté demasiado alto."
start: "Empezar a tocar (pantalla completa, teclado bloqueado)"
secureInput: "Otra app activó la entrada de teclado segura, como la de Terminal o un campo de contraseña, y así ninguna app puede bloquear el teclado. Desactívala o reinicia el ordenador y vuelve a empezar."
lockFailed: "No se pudo bloquear el teclado. Comprueba que Mash Piano esté activado en Ajustes del Sistema › Privacidad y seguridad › Accesibilidad; tras una actualización, elimina la entrada antigua (−) y vuelve a añadirla."
windowsLimits: "Ninguna app puede bloquear Ctrl+Alt+Supr; Win+L se bloquea mientras el bebé toca."
cornerHint: "Padres: mantened pulsada la esquina superior derecha 3 segundos para salir"
touchIntro: "Cada toque, o cada tecla de un teclado conectado, suena como una nota suave de piano, todas en una escala que siempre suena bien."
touchLockIOS: "Para que el bebé no salga del piano, activa Acceso Guiado: Ajustes › Accesibilidad › Acceso Guiado y, con el piano sonando, pulsa tres veces el botón lateral."
touchLockAndroid: "Para que el bebé no salga del piano, fíjalo: Ajustes › Seguridad › Fijar aplicaciones y fija Mash Piano desde las aplicaciones recientes."
touchStart: "Empezar a tocar"
scale: "Notas"
scalePentatonic: "Cinco notas"
scalePentatonicNote: "Do re mi sol la. Siempre suena bonito."
scaleMajor: "Siete notas"
scaleMajorNote: "Las teclas blancas: do re mi fa sol la si."
scaleChromatic: "Las doce"
scaleChromaticNote: "Teclas blancas y negras, todas las notas."
visualsTitle: "Fuegos artificiales"
visualsNote: "Un estallido de color con cada nota. No hace falta si el bebé no ve la pantalla."
noteNamesTitle: Nombres de notas en las teclas
noteNamesNote: Muestra C D E F G A B en cada tecla, para aprender las notas juntos.
lockMouseTitle: "Bloquear también el ratón y el trackpad"
lockMouseNote: "Recomendado en portátiles. Para salir, escribe quitpiano."
keyboardOn: "Teclado conectado"
keyboardOnNote: "El bebé toca el teclado, cada tecla una nota, como en un ordenador."
keyboardOff: "Sin teclado"
keyboardOffNote: "El bebé toca las teclas grandes de colores en la pantalla. Conecta un teclado para tocar con él."
desktopApp: "Mash Piano también es gratis para Mac y Windows, donde el bebé toca un teclado de ordenador de verdad y todo el teclado queda bloqueado."
desktopAppLink: "Descargar para Mac y Windows"

