appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Una volta avviato, il piano riempie lo schermo e prende tutta la tastiera. Qualunque tasto il bambino prema suona una dolce nota di pianoforte, e niente chiude l’app, cambia applicazione o apre scorciatoie di sistema. Ogni tasto ha la sua nota, grave in basso a sinistra e acuta in alto a destra."
exitHow: "Per uscire: tieni il mouse nell’angolo in alto a destra dello schermo per 3 secondi, oppure digita quitpiano sulla tastiera."
exitHowTyped: "Per uscire: digita quitpiano sulla tastiera."
permissionMissing: "Il piano ha bisogno del permesso Accessibilità per prendere la tastiera. Apri l’impostazione e attiva Mash Piano; questa riga diventerà verde da sola."
permissionGranted: "Il piano può prendere tutta la tastiera."
openSettings: "Apri le impostazioni Accessibilità"
soundLoading: "Caricamento del piano…"
soundFailed: "Impossibile avviare l’audio: {error}. Controlla l’uscita audio, poi riapri il piano."
volume: "Volume"
volumeLocked: "I tasti del volume sono bloccati mentre il bambino suona, quindi regolalo prima qui."
tryIt: "Prova"
systemVolumeOver: "Il volume del computer è al {percent, number}%. Scenderà al {cap, number}% quando il bambino inizia, per proteggere le sue orecchie."
systemVolumeOk: "Il volume del computer è al {percent, number}% e resta al {cap, number}% o meno mentre il bambino suona."
systemVolumeUnknown: "Il volume di questa uscita non si può leggere, come con HDMI e alcuni altoparlanti. Controlla che non sia troppo alto."
start: "Inizia a suonare (schermo intero, tastiera bloccata)"
secureInput: "Un’altra app ha attivato l’inserimento sicuro da tastiera, come quello di Terminale o un campo password, e così nessuna app può bloccare la tastiera. Disattivalo o riavvia il computer, poi ricomincia."
lockFailed: "Impossibile bloccare la tastiera. Controlla che Mash Piano sia attivo in Impostazioni di Sistema › Privacy e sicurezza › Accessibilità; dopo un aggiornamento, rimuovi la vecchia voce (−) e aggiungila di nuovo."
lockFailedWindows: "Non è stato possibile bloccare la tastiera. Chiudi Mash Piano e riaprilo; se ancora non funziona, riavvia il computer."
windowsLimits: "Nessuna app può bloccare Ctrl+Alt+Canc; Win+L è bloccato mentre il bambino suona."
cornerHint: "Genitori: tenete premuto l’angolo in alto a destra per 3 secondi per uscire"
touchIntro: "Ogni tocco, o ogni tasto di una tastiera collegata, suona una dolce nota di pianoforte, tutte in una scala che suona sempre bene."
touchLockIOS: "Per tenere il bambino nel piano, attiva Accesso Guidato: Impostazioni › Accessibilità › Accesso Guidato, poi premi tre volte il tasto laterale mentre il piano suona."
touchLockAndroid: "Per tenere il bambino nel piano, bloccalo sullo schermo: Impostazioni › Sicurezza › Blocco app su schermo, poi blocca Mash Piano dalle app recenti."
touchStart: "Inizia a suonare"
scale: "Note"
scalePentatonic: "Cinque note"
scalePentatonicNote: "Do re mi sol la. Suona sempre bene."
scaleMajor: "Sette note"
scaleMajorNote: "I tasti bianchi, do re mi fa sol la si."
scaleChromatic: "Tutte e dodici"
scaleChromaticNote: "Tasti bianchi e neri, ogni nota."
visualsTitle: "Fuochi d’artificio"
visualsNote: "Un’esplosione di colori per ogni nota. Non serve se il bambino non vede lo schermo."
noteNamesTitle: Nomi delle note sui tasti
noteNamesNote: Mostra C D E F G A B su ogni tasto, per imparare le note insieme.
lockMouseTitle: "Blocca anche mouse e trackpad"
lockMouseNote: "Consigliato sui portatili. Poi esci digitando quitpiano."
keyboardOn: "Tastiera collegata"
keyboardOnNote: "Il bambino suona la tastiera, ogni tasto una nota, come su un computer."
keyboardOff: "Nessuna tastiera"
keyboardOffNote: "Il bambino tocca i grandi tasti colorati sullo schermo. Collega una tastiera per suonare con quella."
desktopApp: "Mash Piano è gratis anche per Mac e Windows, dove il bambino suona una vera tastiera del computer e tutta la tastiera è bloccata."
desktopAppLink: "Scarica per Mac e Windows"

