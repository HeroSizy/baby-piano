appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "시작하면 피아노가 화면을 가득 채우고 키보드 전체를 맡습니다. 아기가 무엇을 눌러도 부드러운 피아노 소리만 나고, 종료되거나 앱이 바뀌거나 시스템 단축키가 열리지 않습니다. 키마다 음이 있어 왼쪽 아래가 가장 낮고 오른쪽 위가 가장 높습니다."
exitHow: "끝내려면: 화면 오른쪽 위 모서리에서 마우스를 3초간 누르고 있거나, 키보드로 quitpiano를 입력하세요."
exitHowTyped: "끝내려면: 키보드로 quitpiano를 입력하세요."
permissionMissing: "키보드를 맡으려면 '손쉬운 사용' 권한이 필요합니다. 설정을 열고 Mash Piano를 켜세요. 켜면 이 줄이 저절로 초록색으로 바뀝니다."
permissionGranted: "키보드 전체를 맡을 수 있습니다."
openSettings: "'손쉬운 사용' 설정 열기"
soundLoading: "피아노 불러오는 중…"
soundFailed: "소리를 시작할 수 없습니다: {error}. 사운드 출력을 확인한 뒤 다시 열어 주세요."
volume: "음량"
volumeLocked: "아기가 노는 동안 키보드의 음량 키가 잠기니 여기서 먼저 맞춰 두세요."
tryIt: "들어보기"
systemVolumeOver: "컴퓨터 음량은 {percent, number}%입니다. 아기 귀를 보호하기 위해 시작하면 {cap, number}%로 낮아집니다."
systemVolumeOk: "컴퓨터 음량은 {percent, number}%이며, 노는 동안 {cap, number}% 이하로 유지됩니다."
systemVolumeUnknown: "이 출력 장치(HDMI, 일부 스피커 등)의 음량은 읽을 수 없습니다. 너무 크지 않은지 확인하세요."
start: "연주 시작 (전체 화면, 키보드 잠금)"
secureInput: "다른 앱이 '보안 키보드 입력'을 켰습니다(터미널의 보안 키보드 입력, 암호 입력란 등). 이 상태에서는 어떤 앱도 키보드를 잠글 수 없습니다. 끄거나 컴퓨터를 재시동한 뒤 다시 시작하세요."
lockFailed: "키보드를 잠글 수 없습니다. 시스템 설정 › 개인정보 보호 및 보안 › 손쉬운 사용에서 Mash Piano가 켜져 있는지 확인하세요. 업데이트 후에는 이전 항목을 삭제(−)하고 다시 추가하세요."
lockFailedWindows: "키보드를 잠글 수 없습니다. Mash Piano를 닫았다가 다시 열어 주세요. 그래도 안 되면 컴퓨터를 다시 시작해 주세요."
windowsLimits: "Ctrl+Alt+Del은 어떤 앱도 막을 수 없습니다. Win+L은 노는 동안 막힙니다."
cornerHint: "부모님: 오른쪽 위 모서리를 3초간 누르면 종료"
touchIntro: "화면을 탭하거나 연결된 키보드의 키를 누를 때마다 부드러운 피아노 음이 납니다. 모두 같은 음계라 언제나 잘 어울립니다."
touchLockIOS: "아기가 피아노에서 나가지 않게 하려면 '사용법 유도'를 켜세요: 설정 › 손쉬운 사용 › 사용법 유도. 그런 다음 피아노가 연주되는 동안 측면 버튼을 세 번 누르세요."
touchLockAndroid: "아기가 피아노에서 나가지 않게 하려면 앱을 고정하세요: 설정 › 보안 › 앱 고정. 그런 다음 최근 앱에서 Mash Piano를 고정하세요."
touchStart: "연주 시작"
scale: "음"
scalePentatonic: "다섯 음"
scalePentatonicNote: "도 레 미 솔 라. 언제나 듣기 좋아요."
scaleMajor: "일곱 음"
scaleMajorNote: "흰 건반의 도 레 미 파 솔 라 시."
scaleChromatic: "열두 음 모두"
scaleChromaticNote: "흰 건반과 검은 건반, 모든 음."
visualsTitle: "불꽃놀이"
visualsNote: "음마다 알록달록한 불꽃. 아기가 화면을 볼 수 없다면 필요 없습니다."
noteNamesTitle: 건반에 음 이름 표시
noteNamesNote: 건반마다 C D E F G A B를 보여 줘요. 함께 음을 익힐 때 켜세요.
lockMouseTitle: "마우스와 트랙패드도 잠그기"
lockMouseNote: "노트북에 권장. 끝내려면 quitpiano를 입력하세요."
keyboardOn: "키보드 연결됨"
keyboardOnNote: "컴퓨터에서처럼 아기가 키보드를 칩니다. 키마다 음이 하나씩 있습니다."
keyboardOff: "키보드 없음"
keyboardOffNote: "아기가 화면의 크고 알록달록한 건반을 탭합니다. 키보드를 연결하면 키보드로 연주합니다."
desktopApp: "Mash Piano는 Mac과 Windows에서도 무료입니다. 아기가 진짜 컴퓨터 키보드를 치고, 키보드 전체가 잠깁니다."
desktopAppLink: "Mac 및 Windows용 다운로드"

