appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "När pianot startar fyller det skärmen och tar över hela tangentbordet. Vad bebisen än trycker på spelas en mjuk pianoton, och inget avslutar appen, byter program eller öppnar systemkortkommandon. Varje tangent har sin egen ton, låg längst ned till vänster och hög längst upp till höger."
exitHow: "Avsluta: håll musen i skärmens övre högra hörn i 3 sekunder, eller skriv quitpiano på tangentbordet."
exitHowTyped: "Avsluta: skriv quitpiano på tangentbordet."
permissionMissing: "Pianot behöver behörigheten Hjälpmedel för att ta över tangentbordet. Öppna inställningen och slå på Mash Piano; raden blir grön av sig själv."
permissionGranted: "Pianot får ta över hela tangentbordet."
openSettings: "Öppna inställningar för Hjälpmedel"
soundLoading: "Laddar pianot …"
soundFailed: "Ljudet kunde inte starta: {error}. Kontrollera ljudutgången och öppna pianot igen."
volume: "Volym"
volumeLocked: "Tangentbordets volymknappar är låsta medan bebisen spelar, så ställ in volymen här först."
tryIt: "Prova"
systemVolumeOver: "Datorns volym är {percent, number} %. Den sänks till {cap, number} % när bebisen börjar, för att skydda öronen."
systemVolumeOk: "Datorns volym är {percent, number} % och håller sig på {cap, number} % eller lägre medan bebisen spelar."
systemVolumeUnknown: "Volymen för den här utgången går inte att läsa, som med HDMI och vissa högtalare. Kontrollera att den inte är för hög."
start: "Börja spela (helskärm, tangentbordet låst)"
secureInput: "En annan app har slagit på säker tangentbordsinmatning, till exempel Terminals eller ett lösenordsfält, och då kan ingen app låsa tangentbordet. Stäng av den eller starta om datorn och börja sedan igen."
lockFailed: "Tangentbordet kunde inte låsas. Kontrollera att Mash Piano är påslaget i Systeminställningar › Integritet och säkerhet › Hjälpmedel; efter en uppdatering tar du bort den gamla posten (−) och lägger till den igen."
windowsLimits: "Ctrl+Alt+Del kan ingen app blockera; Win+L är blockerat medan bebisen spelar."
cornerHint: "Föräldrar: håll det övre högra hörnet i 3 sekunder för att avsluta"
touchIntro: "Varje tryck, eller varje tangent på ett anslutet tangentbord, spelar en mjuk pianoton, alla i en skala som alltid låter fint ihop."
touchLockIOS: "För att hålla bebisen kvar i pianot slår du på Guidad åtkomst: Inställningar › Hjälpmedel › Guidad åtkomst, och trycker sedan tre gånger på sidoknappen medan pianot spelar."
touchLockAndroid: "För att hålla bebisen kvar i pianot fäster du det: Inställningar › Säkerhet › Fäst app, och fäster sedan Mash Piano från de senaste apparna."
touchStart: "Börja spela"
scale: "Toner"
scalePentatonic: "Fem toner"
scalePentatonicNote: "Do re mi sol la. Låter alltid fint."
scaleMajor: "Sju toner"
scaleMajorNote: "De vita tangenterna, do re mi fa sol la ti."
scaleChromatic: "Alla tolv"
scaleChromaticNote: "Vita och svarta tangenter, varje ton."
visualsTitle: "Fyrverkeri"
visualsNote: "En färgglad explosion för varje ton. Behövs inte om bebisen inte ser skärmen."
lockMouseTitle: "Lås även mus och styrplatta"
lockMouseNote: "Rekommenderas på bärbara datorer. Avsluta då genom att skriva quitpiano."
keyboardOn: "Tangentbord anslutet"
keyboardOnNote: "Bebisen spelar på tangentbordet, en ton per tangent, som på en dator."
keyboardOff: "Inget tangentbord"
keyboardOffNote: "Bebisen trycker på de stora färgade tangenterna på skärmen. Anslut ett tangentbord för att spela på det."
desktopApp: "Mash Piano finns också gratis för Mac och Windows, där bebisen spelar på ett riktigt datortangentbord och hela tangentbordet är låst."
desktopAppLink: "Hämta för Mac och Windows"

