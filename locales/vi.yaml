appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Khi bắt đầu, đàn sẽ phủ kín màn hình và tiếp quản toàn bộ bàn phím. Bé bấm phím nào cũng chỉ phát ra một nốt piano êm dịu, không gì có thể thoát ứng dụng, chuyển ứng dụng hay mở phím tắt hệ thống. Mỗi phím có một nốt riêng, trầm ở góc dưới bên trái và cao ở góc trên bên phải."
exitHow: "Để dừng: giữ chuột ở góc trên bên phải màn hình trong 3 giây, hoặc gõ quitpiano trên bàn phím."
exitHowTyped: "Để dừng: gõ quitpiano trên bàn phím."
permissionMissing: "Đàn cần quyền Trợ năng để tiếp quản bàn phím. Hãy mở cài đặt và bật Mash Piano; dòng này sẽ tự chuyển sang màu xanh."
permissionGranted: "Đàn có thể tiếp quản toàn bộ bàn phím."
openSettings: "Mở cài đặt Trợ năng"
soundLoading: "Đang tải đàn…"
soundFailed: "Không thể bật âm thanh: {error}. Hãy kiểm tra đầu ra âm thanh rồi mở lại đàn."
volume: "Âm lượng"
volumeLocked: "Các phím âm lượng bị khóa khi bé chơi, nên hãy chỉnh ở đây trước."
tryIt: "Nghe thử"
output: "Đầu ra âm thanh"
outputPlayingOn: "Đang phát trên {device}"
outputChoose: "Chọn nơi phát âm thanh"
outputNote: "Tai nghe, loa Bluetooth hoặc AirPlay: chạm nút để chuyển."
systemVolumeOver: "Âm lượng máy tính là {percent, number}%. Âm lượng sẽ giảm xuống {cap, number}% khi bé bắt đầu, để bảo vệ tai bé."
systemVolumeOk: "Âm lượng máy tính là {percent, number}% và giữ ở mức {cap, number}% trở xuống khi bé chơi."
systemVolumeUnknown: "Không đọc được âm lượng của đầu ra này, như HDMI và một số loa. Hãy kiểm tra để không quá to."
start: "Bắt đầu chơi (toàn màn hình, khóa bàn phím)"
secureInput: "Một ứng dụng khác đã bật nhập bàn phím bảo mật, chẳng hạn trong Terminal hoặc ô mật khẩu, nên không ứng dụng nào khóa được bàn phím. Hãy tắt nó hoặc khởi động lại máy tính, rồi bắt đầu lại."
lockFailed: "Không thể khóa bàn phím. Hãy kiểm tra Mash Piano đã được bật trong Cài đặt hệ thống › Quyền riêng tư & Bảo mật › Trợ năng; sau khi cập nhật, hãy xóa mục cũ (−) rồi thêm lại."
windowsLimits: "Không ứng dụng nào chặn được Ctrl+Alt+Del; Win+L bị chặn khi bé chơi."
cornerHint: "Phụ huynh: giữ góc trên bên phải 3 giây để dừng"
touchIntro: "Mỗi lần chạm, hoặc mỗi phím trên bàn phím đã kết nối, sẽ phát một nốt piano êm dịu, tất cả trong một thang âm luôn nghe hài hòa."
touchLockIOS: "Để bé không thoát khỏi đàn, hãy bật Truy cập được hướng dẫn: Cài đặt › Trợ năng › Truy cập được hướng dẫn, rồi bấm ba lần nút sườn khi đàn đang chơi."
touchLockAndroid: "Để bé không thoát khỏi đàn, hãy ghim ứng dụng: Cài đặt › Bảo mật › Ghim ứng dụng, rồi ghim Mash Piano từ các ứng dụng gần đây."
touchStart: "Bắt đầu chơi"
scale: "Nốt"
scalePentatonic: "Năm nốt"
scalePentatonicNote: "Đô rê mi son la. Luôn nghe dễ thương."
scaleMajor: "Bảy nốt"
scaleMajorNote: "Các phím trắng, đô rê mi fa son la si."
scaleChromatic: "Đủ mười hai"
scaleChromaticNote: "Phím trắng và phím đen, mọi nốt."
visualsTitle: "Pháo hoa"
visualsNote: "Một chùm pháo hoa rực rỡ cho mỗi nốt. Không cần nếu bé không nhìn thấy màn hình."
lockMouseTitle: "Khóa cả chuột và bàn di chuột"
lockMouseNote: "Nên dùng trên máy tính xách tay. Khi đó dừng bằng cách gõ quitpiano."
keyboardOn: "Đã kết nối bàn phím"
keyboardOnNote: "Bé chơi trên bàn phím, mỗi phím một nốt, như trên máy tính."
keyboardOff: "Không có bàn phím"
keyboardOffNote: "Bé chạm vào các phím lớn nhiều màu trên màn hình. Kết nối bàn phím để chơi trên đó."
desktopApp: "Mash Piano cũng miễn phí cho Mac và Windows, nơi bé chơi trên bàn phím máy tính thật và toàn bộ bàn phím được khóa."
desktopAppLink: "Tải về cho Mac và Windows"

