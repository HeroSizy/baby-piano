appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "始めると画面いっぱいに広がり、キーボード全体を引き受けます。赤ちゃんがどこを押してもやさしいピアノの音が鳴るだけで、終了やアプリの切り替え、システムのショートカットは起きません。キーごとに音があり、左下がいちばん低く、右上がいちばん高い音です。"
exitHow: "終了するには：画面の右上隅でマウスを 3 秒押し続けるか、キーボードで quitpiano と入力します。"
exitHowTyped: "終了するには：キーボードで quitpiano と入力します。"
permissionMissing: "キーボードを引き受けるには「アクセシビリティ」の許可が必要です。設定を開いて Mash Piano をオンにしてください。オンになるとこの行は自動で緑になります。"
permissionGranted: "キーボード全体を引き受けられます。"
