systemVolumeUnknown: "この出力（HDMI や一部のスピーカーなど）の音量は読み取れません。大きすぎないか確認してください。"
start: "演奏を始める（全画面・キーボードをロック）"
secureInput: "別のアプリが「セキュアキーボード入力」をオンにしています（ターミナルのセキュアキーボード入力やパスワード欄など）。この間はどのアプリもキーボードをロックできません。オフにするかコンピュータを再起動してから、もう一度始めてください。"
lockFailed: "キーボードをロックできませんでした。システム設定 › プライバシーとセキュリティ › アクセシビリティ で Mash Piano がオンになっているか確認してください。アップデート後は古い項目を削除（−）してから追加し直してください。"
windowsLimits: "Ctrl+Alt+Del はどのアプリも止められません。Win+L は遊んでいる間ブロックされます。"
cornerHint: "保護者の方：右上隅を 3 秒押すと終了"
touchIntro: "画面をタップしても、つないだキーボードのキーを押しても、やさしいピアノの音が鳴ります。音はすべて同じ音階なので、いつもきれいに響きます。"
touchLockIOS: "赤ちゃんがアプリから出ないようにするには「アクセスガイド」をオンに：設定 › アクセシビリティ › アクセスガイド。ピアノが鳴っている間にサイドボタンをトリプルクリックします。"
touchLockAndroid: "赤ちゃんがアプリから出ないようにするには固定します：設定 › セキュリティ › アプリ固定。その後、最近使ったアプリから Mash Piano を固定します。"
touchStart: "演奏を始める"
