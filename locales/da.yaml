lockFailed: "Tastaturet kunne ikke låses. Tjek, at Mash Piano er slået til under Systemindstillinger › Anonymitet & sikkerhed › Tilgængelighed; efter en opdatering skal du fjerne den gamle post (−) og tilføje den igen."
windowsLimits: "Ctrl+Alt+Del kan ingen app blokere; Win+L er blokeret, mens babyen spiller."
cornerHint: "Forældre: hold øverste højre hjørne i 3 sekunder for at stoppe"
touchIntro: "Hvert tryk, eller hver tast på et tilsluttet tastatur, spiller en blød klavertone, alle i en skala, der altid lyder pænt sammen."
touchLockIOS: "For at holde babyen i klaveret skal du slå Guidet adgang til: Indstillinger › Tilgængelighed › Guidet adgang, og derefter trykke tre gange på sideknappen, mens klaveret spiller."
touchLockAndroid: "For at holde babyen i klaveret skal du fastgøre det: Indstillinger › Sikkerhed › Fastgørelse af apps, og derefter fastgøre Mash Piano fra de seneste apps."
touchStart: "Begynd at spille"
scale: "Toner"
