scalePentatonicNote: "Do re mi sol la. Lyder altid dejligt."
scaleMajor: "Syv toner"
scaleMajorNote: "De hvide tangenter, do re mi fa sol la si."
scaleChromatic: "Alle tolv"
scaleChromaticNote: "Hvide og sorte tangenter, hver eneste tone."
visualsTitle: "Fyrværkeri"
visualsNote: "Et farverigt brag for hver tone. Ikke nødvendigt, hvis babyen ikke kan se skærmen."
lockMouseTitle: "Lås også mus og pegefelt"
lockMouseNote: "Anbefales på bærbare. Stop så ved at skrive quitpiano."
keyboardOn: "Tastatur tilsluttet"
