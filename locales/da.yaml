appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Når klaveret starter, fylder det skærmen og overtager hele tastaturet. Uanset hvad babyen trykker på, spiller det en blød klavertone, og intet lukker appen, skifter program eller åbner systemgenveje. Hver tast har sin egen tone, dyb nederst til venstre og lys øverst til højre."
exitHow: "Stop: hold musen i skærmens øverste højre hjørne i 3 sekunder, eller skriv quitpiano på tastaturet."
exitHowTyped: "Stop: skriv quitpiano på tastaturet."
