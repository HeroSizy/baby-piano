appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "शुरू करने पर पियानो पूरी स्क्रीन पर आ जाता है और पूरा कीबोर्ड अपने हाथ में ले लेता है। बच्चा जो भी दबाए, एक मधुर पियानो सुर बजता है, और कुछ भी ऐप बंद नहीं करता, ऐप नहीं बदलता और सिस्टम शॉर्टकट नहीं खोलता। हर कुंजी का अपना सुर है, नीचे बाईं ओर नीचा और ऊपर दाईं ओर ऊँचा।"
exitHow: "रोकने के लिए: माउस को स्क्रीन के ऊपरी दाएँ कोने में 3 सेकंड दबाए रखें, या कीबोर्ड पर quitpiano टाइप करें।"
exitHowTyped: "रोकने के लिए: कीबोर्ड पर quitpiano टाइप करें।"
permissionMissing: "कीबोर्ड अपने हाथ में लेने के लिए पियानो को ऐक्सेसिबिलिटी अनुमति चाहिए। सेटिंग खोलें और Mash Piano चालू करें; यह पंक्ति अपने आप हरी हो जाएगी।"
permissionGranted: "पियानो पूरा कीबोर्ड अपने हाथ में ले सकता है।"
openSettings: "ऐक्सेसिबिलिटी सेटिंग्ज़ खोलें"
soundLoading: "पियानो लोड हो रहा है…"
soundFailed: "आवाज़ शुरू नहीं हो सकी: {error}। साउंड आउटपुट जाँचें, फिर पियानो दोबारा खोलें।"
volume: "आवाज़"
volumeLocked: "बच्चे के खेलते समय कीबोर्ड की वॉल्यूम कुंजियाँ लॉक रहती हैं, इसलिए पहले यहाँ सेट कर लें।"
tryIt: "सुनकर देखें"
output: "आवाज़ का आउटपुट"
outputPlayingOn: "{device} पर बज रहा है"
outputChoose: "चुनें कि आवाज़ कहाँ से आए"
outputNote: "हेडफ़ोन, ब्लूटूथ स्पीकर या AirPlay: बदलने के लिए बटन दबाएँ।"
systemVolumeOver: "कंप्यूटर की आवाज़ {percent, number}% है। बच्चे के कानों की सुरक्षा के लिए, बच्चे के शुरू करते ही यह {cap, number}% पर आ जाएगी।"
systemVolumeOk: "कंप्यूटर की आवाज़ {percent, number}% है, और बच्चे के खेलते समय {cap, number}% या उससे कम रहती है।"
systemVolumeUnknown: "इस आउटपुट की आवाज़ पढ़ी नहीं जा सकती, जैसे HDMI और कुछ स्पीकर में। जाँच लें कि बहुत तेज़ न हो।"
start: "बजाना शुरू करें (पूरी स्क्रीन, कीबोर्ड लॉक)"
secureInput: "किसी दूसरे ऐप ने सुरक्षित कीबोर्ड प्रविष्टि चालू कर दी है, जैसे Terminal में या पासवर्ड फ़ील्ड में, और तब कोई भी ऐप कीबोर्ड लॉक नहीं कर सकता। उसे बंद करें, या कंप्यूटर रीस्टार्ट करें, फिर दोबारा शुरू करें।"
lockFailed: "कीबोर्ड लॉक नहीं हो सका। जाँचें कि सिस्टम सेटिंग्ज़ › गोपनीयता और सुरक्षा › ऐक्सेसिबिलिटी में Mash Piano चालू है; अपडेट के बाद पुरानी प्रविष्टि हटाएँ (−) और फिर से जोड़ें।"
windowsLimits: "Ctrl+Alt+Del को कोई ऐप नहीं रोक सकता; बच्चे के खेलते समय Win+L रोका रहता है।"
cornerHint: "माता-पिता: रोकने के लिए ऊपरी दायाँ कोना 3 सेकंड दबाए रखें"
touchIntro: "हर टैप, या जुड़े कीबोर्ड की हर कुंजी, एक मधुर पियानो सुर बजाती है, सब ऐसे सरगम में जो हमेशा साथ में अच्छा लगता है।"
touchLockIOS: "बच्चे को पियानो में ही रखने के लिए, गाइडेड ऐक्सेस चालू करें: सेटिंग्ज़ › ऐक्सेसिबिलिटी › गाइडेड ऐक्सेस, फिर पियानो बजते समय साइड बटन तीन बार दबाएँ।"
touchLockAndroid: "बच्चे को पियानो में ही रखने के लिए, उसे पिन करें: सेटिंग › सुरक्षा › ऐप पिन करना, फिर हाल ही के ऐप में से Mash Piano को पिन करें।"
touchStart: "बजाना शुरू करें"
scale: "सुर"
scalePentatonic: "पाँच सुर"
scalePentatonicNote: "सा रे ग प ध। हमेशा प्यारा लगता है।"
scaleMajor: "सात सुर"
scaleMajorNote: "सफ़ेद कुंजियाँ, सा रे ग म प ध नि।"
scaleChromatic: "सभी बारह"
scaleChromaticNote: "सफ़ेद और काली कुंजियाँ, हर सुर।"
visualsTitle: "आतिशबाज़ी"
visualsNote: "हर सुर पर एक रंगीन फुहार। अगर बच्चा स्क्रीन नहीं देख सकता तो ज़रूरी नहीं।"
lockMouseTitle: "माउस और ट्रैकपैड भी लॉक करें"
lockMouseNote: "लैपटॉप पर सुझाया गया। तब रोकने के लिए quitpiano टाइप करें।"
keyboardOn: "कीबोर्ड जुड़ा है"
keyboardOnNote: "बच्चा कीबोर्ड बजाता है, हर कुंजी एक सुर, जैसे कंप्यूटर पर।"
keyboardOff: "कोई कीबोर्ड नहीं"
keyboardOffNote: "बच्चा स्क्रीन पर बड़ी रंगीन कुंजियाँ टैप करता है। उस पर बजाने के लिए कीबोर्ड जोड़ें।"
desktopApp: "Mash Piano Mac और Windows के लिए भी मुफ़्त है, जहाँ बच्चा असली कंप्यूटर कीबोर्ड बजाता है और पूरा कीबोर्ड लॉक रहता है।"
desktopAppLink: "Mac और Windows के लिए डाउनलोड करें"

