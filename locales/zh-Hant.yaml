appName: "Mash Piano"
title: "寶寶鋼琴"
desktopIntro: "開始後會全螢幕，並接管整個鍵盤：寶寶隨便按都只會彈出好聽的鋼琴聲，不會退出、切換程式或觸發系統快捷鍵。每個鍵都有自己的音，左下最低，右上最高。"
exitHow: "家長退出：用滑鼠在螢幕右上角按住不放 3 秒，或在鍵盤上輸入 quitpiano。"
exitHowTyped: "家長退出：在鍵盤上輸入 quitpiano。"
permissionMissing: "鎖住鍵盤需要「輔助使用」權限。請打開設定，開啟「Mash Piano」的開關，開啟後這裡會自動變綠。"
permissionGranted: "已取得權限，可以鎖住整個鍵盤。"
openSettings: "打開「輔助使用」設定"
soundLoading: "正在載入鋼琴……"
soundFailed: "聲音無法啟動：{error}。請檢查聲音輸出裝置後重新打開程式。"
volume: "音量"
volumeLocked: "開始後鍵盤上的音量鍵會被鎖住，請先在這裡調好。"
tryIt: "試聽"
output: "聲音輸出"
outputPlayingOn: "正在用 {device} 播放"
outputChoose: "選擇聲音從哪裡播放"
outputNote: "耳機、藍牙喇叭或 AirPlay：點右邊的按鈕切換。"
systemVolumeOver: "電腦音量現在是 {percent, number}%，開始彈琴時會自動降到 {cap, number}%，保護寶寶的耳朵。"
systemVolumeOk: "電腦音量：{percent, number}%（彈琴時不會超過 {cap, number}%）。"
systemVolumeUnknown: "目前的輸出裝置無法讀取音量（如 HDMI、部分外接喇叭），請自行確認音量不要太大。"
start: "開始彈琴（全螢幕鎖定鍵盤）"
secureInput: "有程式開啟了「安全鍵盤輸入」（如終端機的「安全鍵盤輸入」、正在輸入的密碼欄），這時任何程式都鎖不住鍵盤。請關閉它（或重新開機）後再開始。"
lockFailed: "無法鎖定鍵盤。請確認已在 系統設定 › 隱私權與安全性 › 輔助使用 中開啟「Mash Piano」；更新版本後，請先刪除舊項目（−）再重新加入。"
windowsLimits: "Ctrl+Alt+Del 任何程式都擋不住；Win+L 在彈琴時會被停用。"
cornerHint: "家長：在右上角按住 3 秒退出"
touchIntro: "點一下螢幕，或按一下接上的鍵盤，都會彈出一個輕柔的鋼琴音，所有的音都在同一個音階裡，怎麼彈都好聽。"
touchLockIOS: "想讓寶寶出不去，請開啟「引導使用模式」：設定 › 輔助使用 › 引導使用模式，然後在彈琴時連按三下側邊按鈕。"
touchLockAndroid: "想讓寶寶出不去，請固定應用程式：設定 › 安全性 › 應用程式固定，然後在最近使用的應用程式中固定「Mash Piano」。"
touchStart: "開始彈琴"
scale: "音階"
scalePentatonic: "五聲音階"
scalePentatonicNote: "do re mi sol la，怎麼按都好聽。"
scaleMajor: "七聲音階"
scaleMajorNote: "鋼琴白鍵的 do re mi fa sol la si。"
scaleChromatic: "全部的音"
scaleChromaticNote: "黑鍵白鍵都有，12 個音全用上。"
visualsTitle: "彩色煙火"
visualsNote: "每個音放一朵煙火。寶寶看不到螢幕的話不用開。"
lockMouseTitle: "同時鎖住滑鼠和觸控板"
lockMouseNote: "筆電建議開啟。開啟後只能輸入 quitpiano 退出。"
keyboardOn: "已連接鍵盤"
keyboardOnNote: "寶寶直接彈鍵盤，每個鍵一個音，跟電腦上一樣。"
keyboardOff: "沒有連接鍵盤"
keyboardOffNote: "寶寶點螢幕上的彩色大按鍵。接上鍵盤就改成彈鍵盤。"
desktopApp: "Mash Piano 也有免費的 Mac 和 Windows 版：寶寶直接拍電腦鍵盤，整個鍵盤都會被鎖住。"
desktopAppLink: "下載 Mac 和 Windows 版"

