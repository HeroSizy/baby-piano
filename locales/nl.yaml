touchLockIOS: "Om de baby in de piano te houden, zet je Begeleide toegang aan: Instellingen › Toegankelijkheid › Begeleide toegang, en druk dan drie keer op de zijknop terwijl de piano speelt."
touchLockAndroid: "Om de baby in de piano te houden, zet je hem vast: Instellingen › Beveiliging › App vastzetten, en zet Mash Piano vast vanuit de recente apps."
touchStart: "Begin met spelen"
