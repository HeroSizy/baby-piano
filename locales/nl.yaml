lockFailed: "Het toetsenbord kon niet worden vergrendeld. Controleer dat Mash Piano aanstaat in Systeeminstellingen › Privacy en beveiliging › Toegankelijkheid; verwijder na een update het oude item (−) en voeg het opnieuw toe."
windowsLimits: "Ctrl+Alt+Del kan geen enkele app blokkeren; Win+L is geblokkeerd terwijl de baby speelt."
cornerHint: "Ouders: houd de rechterbovenhoek 3 seconden vast om te stoppen"
