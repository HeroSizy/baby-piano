appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Na het starten vult de piano het scherm en neemt hij het hele toetsenbord over. Welke toets de baby ook indrukt, er klinkt een zachte pianotoon, en niets sluit de app, wisselt van programma of opent systeemsneltoetsen. Elke toets heeft zijn eigen toon: laag linksonder en hoog rechtsboven."
exitHow: "Stoppen: houd de muis 3 seconden in de rechterbovenhoek van het scherm, of typ quitpiano op het toetsenbord."
exitHowTyped: "Stoppen: typ quitpiano op het toetsenbord."
permissionMissing: "De piano heeft de toestemming voor Toegankelijkheid nodig om het toetsenbord over te nemen. Open de instelling en zet Mash Piano aan; deze regel wordt vanzelf groen."
permissionGranted: "De piano mag het hele toetsenbord overnemen."
