appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Setelah dimulai, piano memenuhi layar dan mengambil alih seluruh keyboard. Tombol apa pun yang ditekan bayi akan memainkan nada piano yang lembut, dan tidak ada yang menutup app, berpindah app, atau membuka pintasan sistem. Setiap tombol punya nadanya sendiri, rendah di kiri bawah dan tinggi di kanan atas."
exitHow: "Untuk berhenti: tahan mouse di pojok kanan atas layar selama 3 detik, atau ketik quitpiano di keyboard."
exitHowTyped: "Untuk berhenti: ketik quitpiano di keyboard."
permissionMissing: "Piano memerlukan izin Aksesibilitas untuk mengambil alih keyboard. Buka pengaturan dan nyalakan Mash Piano; baris ini akan berubah hijau dengan sendirinya."
permissionGranted: "Piano boleh mengambil alih seluruh keyboard."
openSettings: "Buka pengaturan Aksesibilitas"
soundLoading: "Memuat piano…"
soundFailed: "Suara tidak dapat dimulai: {error}. Periksa output suara, lalu buka piano lagi."
volume: "Volume"
volumeLocked: "Tombol volume keyboard dikunci selama bayi bermain, jadi atur di sini terlebih dahulu."
tryIt: "Coba"
systemVolumeOver: "Volume komputer {percent, number}%. Volume akan turun ke {cap, number}% saat bayi mulai, untuk melindungi telinganya."
systemVolumeOk: "Volume komputer {percent, number}% dan tetap di {cap, number}% atau kurang selama bayi bermain."
systemVolumeUnknown: "Volume output ini tidak dapat dibaca, seperti pada HDMI dan beberapa speaker. Pastikan tidak terlalu keras."
start: "Mulai bermain (layar penuh, keyboard terkunci)"
secureInput: "App lain menyalakan input keyboard aman, misalnya di Terminal atau kolom kata sandi, sehingga tidak ada app yang bisa mengunci keyboard. Matikan, atau mulai ulang komputer, lalu mulai lagi."
lockFailed: "Keyboard tidak dapat dikunci. Pastikan Mash Piano dinyalakan di Pengaturan Sistem › Privasi & Keamanan › Aksesibilitas; setelah pembaruan, hapus entri lama (−) lalu tambahkan lagi."
windowsLimits: "Tidak ada app yang bisa memblokir Ctrl+Alt+Del; Win+L diblokir selama bayi bermain."
cornerHint: "Orang tua: tahan pojok kanan atas selama 3 detik untuk berhenti"
touchIntro: "Setiap ketukan, atau setiap tombol pada keyboard yang terpasang, memainkan nada piano yang lembut, semuanya dalam tangga nada yang selalu terdengar indah."
touchLockIOS: "Agar bayi tetap di piano, nyalakan Akses Terpandu: Pengaturan › Aksesibilitas › Akses Terpandu, lalu klik tiga kali tombol samping saat piano bermain."
touchLockAndroid: "Agar bayi tetap di piano, sematkan aplikasinya: Setelan › Keamanan › Penyematan aplikasi, lalu sematkan Mash Piano dari aplikasi terbaru."
touchStart: "Mulai bermain"
scale: "Nada"
scalePentatonic: "Lima nada"
scalePentatonicNote: "Do re mi sol la. Selalu terdengar indah."
scaleMajor: "Tujuh nada"
scaleMajorNote: "Tuts putih, do re mi fa sol la si."
scaleChromatic: "Kedua belas nada"
scaleChromaticNote: "Tuts putih dan hitam, semua nada."
visualsTitle: "Kembang api"
visualsNote: "Ledakan warna untuk setiap nada. Tidak perlu jika bayi tidak bisa melihat layar."
lockMouseTitle: "Kunci juga mouse dan trackpad"
lockMouseNote: "Disarankan untuk laptop. Berhenti dengan mengetik quitpiano."
keyboardOn: "Keyboard terhubung"
keyboardOnNote: "Bayi memainkan keyboard, setiap tombol satu nada, seperti di komputer."
keyboardOff: "Tidak ada keyboard"
keyboardOffNote: "Bayi mengetuk tuts besar berwarna di layar. Pasang keyboard untuk memainkannya."
desktopApp: "Mash Piano juga gratis untuk Mac dan Windows, tempat bayi memainkan keyboard komputer sungguhan dan seluruh keyboard terkunci."
desktopAppLink: "Unduh untuk Mac dan Windows"

