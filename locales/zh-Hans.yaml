appName: Mash Piano
title: 宝宝钢琴
desktopIntro: 开始后会全屏，并接管整块键盘：宝宝随便按都只会弹出好听的钢琴声，不会退出、切换程序或触发系统快捷键。每个键都有自己的音，左下最低，右上最高。
exitHow: 家长退出：用鼠标在屏幕右上角按住不放 3 秒，或在键盘上输入 quitpiano。
exitHowTyped: 家长退出：在键盘上输入 quitpiano。
permissionMissing: 锁住键盘需要“辅助功能”权限。请打开设置，打开“Mash Piano”的开关，打开后这里会自动变绿。
permissionGranted: 已获得权限，可以锁住整块键盘。
openSettings: 打开“辅助功能”设置
soundLoading: 正在载入钢琴……
soundFailed: 声音无法启动：{error}。请检查声音输出设备后重新打开程序。
volume: 音量
volumeLocked: 开始后键盘上的音量键会被锁住，请先在这里调好。
tryIt: 试听
systemVolumeOver: 电脑音量现在是 {percent, number}%，开始弹琴时会自动降到 {cap, number}%，保护宝宝耳朵。
systemVolumeOk: 电脑音量：{percent, number}%（弹琴时不会超过 {cap, number}%）。
systemVolumeUnknown: 当前输出设备无法读取音量（如 HDMI、部分外接音箱），请手动确认音量不要太大。
start: 开始弹琴（全屏锁定键盘）
secureInput: 有程序开启了“安全键盘输入”（如终端的“安全键盘输入”、正在输入的密码框），这时任何程序都锁不住键盘。请关闭它（或重启电脑）后再开始。
lockFailed: 无法锁定键盘。请确认已在 系统设置 › 隐私与安全性 › 辅助功能 中打开“Mash Piano”；更新版本后，请先删掉旧条目（−）再重新添加。
windowsLimits: Ctrl+Alt+Del 任何程序都拦不住；Win+L 在弹琴时会被禁用。
cornerHint: 家长：在右上角按住 3 秒退出
touchIntro: 点一下屏幕，或者按一下接上的键盘，都会弹出一个轻柔的钢琴音，所有的音都在同一个音阶里，怎么弹都好听。
touchLockIOS: 想让宝宝出不去，请打开“引导式访问”：设置 › 辅助功能 › 引导式访问，然后在弹琴时连按三下侧边按钮。
touchLockAndroid: 想让宝宝出不去，请固定应用：设置 › 安全 › 应用固定，然后在最近任务里固定“Mash Piano”。
touchStart: 开始弹琴
scale: 音阶
scalePentatonic: 五声音阶
scalePentatonicNote: do re mi sol la，怎么按都好听。
scaleMajor: 全音阶
scaleMajorNote: 钢琴白键的 do re mi fa sol la si。
scaleChromatic: 全部音
scaleChromaticNote: 黑键白键都有，12 个音全用上。
visualsTitle: 彩色烟花
visualsNote: 每个音放一朵烟花。宝宝看不到屏幕的话不用开。
lockMouseTitle: 同时锁住鼠标和触控板
lockMouseNote: 笔记本推荐。打开后只能键入 quitpiano 退出。
keyboardOn: 已连接键盘
keyboardOnNote: 宝宝直接弹键盘，每个键一个音，跟电脑上一样。
keyboardOff: 没有连接键盘
keyboardOffNote: 宝宝点屏幕上的彩色大按键。接上键盘就改成弹键盘。
