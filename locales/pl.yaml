appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Po uruchomieniu pianino wypełnia ekran i przejmuje całą klawiaturę. Cokolwiek naciśnie maluch, zabrzmi łagodna nuta pianina, a nic nie zamknie aplikacji, nie przełączy programów ani nie otworzy skrótów systemowych. Każdy klawisz ma swoją nutę: niskie na dole po lewej, wysokie na górze po prawej."
exitHow: "Aby zakończyć: przytrzymaj mysz w prawym górnym rogu ekranu przez 3 sekundy albo wpisz na klawiaturze quitpiano."
exitHowTyped: "Aby zakończyć: wpisz na klawiaturze quitpiano."
permissionMissing: "Aby przejąć klawiaturę, pianino potrzebuje uprawnienia Dostępność. Otwórz ustawienie i włącz Mash Piano; ten wiersz sam zmieni kolor na zielony."
permissionGranted: "Pianino może przejąć całą klawiaturę."
openSettings: "Otwórz ustawienia Dostępności"
soundLoading: "Wczytywanie pianina…"
soundFailed: "Nie udało się uruchomić dźwięku: {error}. Sprawdź wyjście dźwięku i otwórz pianino ponownie."
volume: "Głośność"
volumeLocked: "Klawisze głośności są zablokowane, gdy maluch gra, więc najpierw ustaw ją tutaj."
tryIt: "Wypróbuj"
systemVolumeOver: "Głośność komputera wynosi {percent, number}%. Gdy maluch zacznie, spadnie do {cap, number}%, by chronić jego uszy."
systemVolumeOk: "Głośność komputera wynosi {percent, number}% i podczas gry nie przekroczy {cap, number}%."
systemVolumeUnknown: "Nie można odczytać głośności tego wyjścia, tak jak w przypadku HDMI i niektórych głośników. Sprawdź, czy nie jest za głośno."
start: "Zacznij grać (pełny ekran, klawiatura zablokowana)"
secureInput: "Inna aplikacja włączyła bezpieczne wprowadzanie z klawiatury, np. w Terminalu lub w polu hasła, i wtedy żadna aplikacja nie może zablokować klawiatury. Wyłącz je lub uruchom ponownie komputer i zacznij od nowa."
lockFailed: "Nie udało się zablokować klawiatury. Sprawdź, czy Mash Piano jest włączone w Ustawieniach systemowych › Prywatność i ochrona › Dostępność; po aktualizacji usuń stary wpis (−) i dodaj go ponownie."
lockFailedWindows: "Nie udało się zablokować klawiatury. Zamknij Mash Piano i otwórz ponownie; jeśli nadal nie działa, uruchom ponownie komputer."
windowsLimits: "Ctrl+Alt+Del nie może zablokować żadna aplikacja; Win+L jest zablokowane, gdy maluch gra."
cornerHint: "Rodzice: przytrzymajcie prawy górny róg przez 3 sekundy, aby zakończyć"
touchIntro: "Każde dotknięcie lub klawisz podłączonej klawiatury gra łagodną nutę pianina, a wszystkie należą do skali, która zawsze ładnie brzmi."
touchLockIOS: "Aby maluch nie wyszedł z pianina, włącz Dostęp nadzorowany: Ustawienia › Dostępność › Dostęp nadzorowany, a potem trzy razy naciśnij przycisk boczny, gdy pianino gra."
touchLockAndroid: "Aby maluch nie wyszedł z pianina, przypnij je: Ustawienia › Bezpieczeństwo › Przypinanie aplikacji, a potem przypnij Mash Piano z ostatnich aplikacji."
touchStart: "Zacznij grać"
scale: "Nuty"
scalePentatonic: "Pięć nut"
scalePentatonicNote: "Do re mi sol la. Zawsze brzmi ślicznie."
scaleMajor: "Siedem nut"
scaleMajorNote: "Białe klawisze: do re mi fa sol la si."
scaleChromatic: "Wszystkie dwanaście"
scaleChromaticNote: "Białe i czarne klawisze, każda nuta."
visualsTitle: "Fajerwerki"
visualsNote: "Kolorowy wybuch przy każdej nucie. Niepotrzebne, jeśli maluch nie widzi ekranu."
noteNamesTitle: Nazwy nut na klawiszach
noteNamesNote: Pokazuje C D E F G A B na każdym klawiszu, by razem uczyć się nut.
lockMouseTitle: "Zablokuj też mysz i gładzik"
lockMouseNote: "Zalecane na laptopach. Wtedy zakończ, wpisując quitpiano."
keyboardOn: "Klawiatura podłączona"
keyboardOnNote: "Maluch gra na klawiaturze, każdy klawisz to nuta, jak na komputerze."
keyboardOff: "Brak klawiatury"
keyboardOffNote: "Maluch dotyka dużych kolorowych klawiszy na ekranie. Podłącz klawiaturę, aby grać na niej."
desktopApp: "Mash Piano jest też darmowe na Maca i Windows: tam maluch gra na prawdziwej klawiaturze komputera, a cała klawiatura jest zablokowana."
desktopAppLink: "Pobierz na Maca i Windows"

