appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Käynnistyttyään piano täyttää näytön ja ottaa koko näppäimistön haltuunsa. Mitä tahansa vauva painaa, kuuluu pehmeä pianon sävel, eikä mikään sulje sovellusta, vaihda ohjelmaa tai avaa järjestelmän pikanäppäimiä. Jokaisella näppäimellä on oma sävelensä: matala vasemmalla alhaalla ja korkea oikealla ylhäällä."
exitHow: "Lopettaminen: pidä hiirtä näytön oikeassa yläkulmassa 3 sekuntia tai kirjoita näppäimistöllä quitpiano."
exitHowTyped: "Lopettaminen: kirjoita näppäimistöllä quitpiano."
permissionMissing: "Piano tarvitsee Käyttöapu-luvan ottaakseen näppäimistön haltuun. Avaa asetus ja laita Mash Piano päälle; tämä rivi muuttuu itsestään vihreäksi."
permissionGranted: "Piano voi ottaa koko näppäimistön haltuunsa."
openSettings: "Avaa Käyttöapu-asetukset"
soundLoading: "Ladataan pianoa…"
soundFailed: "Ääntä ei voitu käynnistää: {error}. Tarkista äänen ulostulo ja avaa piano uudelleen."
volume: "Äänenvoimakkuus"
volumeLocked: "Näppäimistön äänenvoimakkuusnäppäimet ovat lukittuina vauvan soittaessa, joten säädä se ensin tästä."
tryIt: "Kokeile"
systemVolumeOver: "Tietokoneen äänenvoimakkuus on {percent, number} %. Se laskee {cap, number} prosenttiin, kun vauva aloittaa, korvien suojaamiseksi."
systemVolumeOk: "Tietokoneen äänenvoimakkuus on {percent, number} % ja pysyy enintään {cap, number} prosentissa vauvan soittaessa."
systemVolumeUnknown: "Tämän ulostulon äänenvoimakkuutta ei voi lukea, kuten HDMI:n ja joidenkin kaiuttimien kohdalla. Tarkista, ettei ääni ole liian kova."
start: "Aloita soittaminen (koko näyttö, näppäimistö lukittu)"
secureInput: "Toinen sovellus on laittanut suojatun näppäimistösyötön päälle, kuten Päätteen suojattu syöttö tai salasanakenttä, eikä mikään sovellus voi silloin lukita näppäimistöä. Laita se pois tai käynnistä tietokone uudelleen ja aloita sitten uudestaan."
lockFailed: "Näppäimistöä ei voitu lukita. Tarkista, että Mash Piano on päällä kohdassa Järjestelmäasetukset › Tietosuoja ja suojaus › Käyttöapu; päivityksen jälkeen poista vanha kohde (−) ja lisää se uudelleen."
lockFailedWindows: "Näppäimistöä ei voitu lukita. Sulje Mash Piano ja avaa se uudelleen; jos se ei vieläkään toimi, käynnistä tietokone uudelleen."
windowsLimits: "Ctrl+Alt+Del-yhdistelmää ei voi estää mikään sovellus; Win+L on estetty vauvan soittaessa."
cornerHint: "Vanhemmat: lopeta pitämällä oikeaa yläkulmaa 3 sekuntia"
touchIntro: "Jokainen napautus tai liitetyn näppäimistön näppäin soittaa pehmeän pianon sävelen, ja kaikki ovat asteikossa, joka kuulostaa aina kauniilta yhdessä."
touchLockIOS: "Pitääksesi vauvan pianossa laita Ohjattu käyttö päälle: Asetukset › Käyttöapu › Ohjattu käyttö, ja paina sitten sivupainiketta kolmesti pianon soidessa."
touchLockAndroid: "Pitääksesi vauvan pianossa kiinnitä se: Asetukset › Tietoturva › Sovelluksen kiinnitys, ja kiinnitä sitten Mash Piano viimeisimmistä sovelluksista."
touchStart: "Aloita soittaminen"
scale: "Sävelet"
scalePentatonic: "Viisi säveltä"
scalePentatonicNote: "Do re mi sol la. Kuulostaa aina ihanalta."
scaleMajor: "Seitsemän säveltä"
scaleMajorNote: "Valkoiset koskettimet, do re mi fa sol la ti."
scaleChromatic: "Kaikki kaksitoista"
scaleChromaticNote: "Valkoiset ja mustat koskettimet, jokainen sävel."
visualsTitle: "Ilotulitus"
visualsNote: "Värikäs räjähdys jokaisesta sävelestä. Ei tarpeen, jos vauva ei näe näyttöä."
noteNamesTitle: Nuottien nimet koskettimissa
noteNamesNote: Näyttää C D E F G A B jokaisessa koskettimessa, niin opitte sävelet yhdessä.
lockMouseTitle: "Lukitse myös hiiri ja ohjauslevy"
lockMouseNote: "Suositellaan kannettavissa. Lopeta silloin kirjoittamalla quitpiano."
keyboardOn: "Näppäimistö liitetty"
keyboardOnNote: "Vauva soittaa näppäimistöä, jokainen näppäin yksi sävel, kuten tietokoneella."
keyboardOff: "Ei näppäimistöä"
keyboardOffNote: "Vauva napauttaa näytön isoja värikkäitä koskettimia. Liitä näppäimistö soittaaksesi sillä."
desktopApp: "Mash Piano on ilmainen myös Macille ja Windowsille: niissä vauva soittaa oikeaa tietokoneen näppäimistöä, ja koko näppäimistö on lukittu."
desktopAppLink: "Lataa Macille ja Windowsille"

