volume: "ระดับเสียง"
volumeLocked: "ปุ่มปรับเสียงบนแป้นพิมพ์จะถูกล็อกขณะลูกน้อยเล่น จึงควรปรับที่นี่ก่อน"
tryIt: "ลองฟัง"
output: "ช่องเสียงออก"
