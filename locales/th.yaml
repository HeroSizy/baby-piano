appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "เมื่อเริ่ม เปียโนจะเต็มหน้าจอและควบคุมแป้นพิมพ์ทั้งหมด ไม่ว่าลูกน้อยจะกดอะไรก็จะได้ยินเสียงเปียโนนุ่มๆ และไม่มีอะไรปิดแอป สลับแอป หรือเปิดปุ่มลัดของระบบ แต่ละปุ่มมีโน้ตของตัวเอง เสียงต่ำอยู่ซ้ายล่าง เสียงสูงอยู่ขวาบน"
exitHow: "วิธีหยุด: กดเมาส์ค้างไว้ที่มุมขวาบนของหน้าจอ 3 วินาที หรือพิมพ์ quitpiano บนแป้นพิมพ์"
exitHowTyped: "วิธีหยุด: พิมพ์ quitpiano บนแป้นพิมพ์"
permissionMissing: "เปียโนต้องได้รับสิทธิ์การช่วยการเข้าถึงเพื่อควบคุมแป้นพิมพ์ เปิดการตั้งค่าแล้วเปิด Mash Piano บรรทัดนี้จะเปลี่ยนเป็นสีเขียวเอง"
permissionGranted: "เปียโนควบคุมแป้นพิมพ์ทั้งหมดได้แล้ว"
openSettings: "เปิดการตั้งค่าการช่วยการเข้าถึง"
soundLoading: "กำลังโหลดเปียโน…"
