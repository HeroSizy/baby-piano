systemVolumeUnknown: "อ่านระดับเสียงของอุปกรณ์นี้ไม่ได้ เช่น HDMI และลำโพงบางรุ่น โปรดตรวจดูว่าเสียงไม่ดังเกินไป"
start: "เริ่มเล่น (เต็มหน้าจอ ล็อกแป้นพิมพ์)"
secureInput: "มีแอปอื่นเปิดการป้อนข้อมูลแป้นพิมพ์แบบปลอดภัยอยู่ เช่นใน Terminal หรือช่องรหัสผ่าน ซึ่งทำให้ไม่มีแอปใดล็อกแป้นพิมพ์ได้ โปรดปิด หรือรีสตาร์ทคอมพิวเตอร์ แล้วเริ่มใหม่"
lockFailed: "ล็อกแป้นพิมพ์ไม่ได้ โปรดตรวจว่าเปิด Mash Piano ไว้ใน การตั้งค่าระบบ › ความเป็นส่วนตัวและความปลอดภัย › การช่วยการเข้าถึง หลังอัปเดต ให้ลบรายการเดิม (−) แล้วเพิ่มใหม่"
windowsLimits: "ไม่มีแอปใดบล็อก Ctrl+Alt+Del ได้ ส่วน Win+L จะถูกบล็อกขณะลูกน้อยเล่น"
cornerHint: "ผู้ปกครอง: กดมุมขวาบนค้างไว้ 3 วินาทีเพื่อหยุด"
touchIntro: "ทุกครั้งที่แตะ หรือกดปุ่มบนแป้นพิมพ์ที่ต่อไว้ จะได้ยินเสียงเปียโนนุ่มๆ ทุกเสียงอยู่ในบันไดเสียงเดียวกันจึงไพเราะเสมอ"
touchLockIOS: "เพื่อให้ลูกน้อยอยู่ในเปียโน ให้เปิดการเข้าถึงที่ได้รับคำแนะนำ: การตั้งค่า › การช่วยการเข้าถึง › การเข้าถึงที่ได้รับคำแนะนำ แล้วกดปุ่มด้านข้างสามครั้งขณะเปียโนเล่น"
touchLockAndroid: "เพื่อให้ลูกน้อยอยู่ในเปียโน ให้ปักหมุดแอป: การตั้งค่า › ความปลอดภัย › การปักหมุดแอป แล้วปักหมุด Mash Piano จากแอปล่าสุด"
touchStart: "เริ่มเล่น"
