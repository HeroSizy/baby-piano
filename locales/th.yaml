desktopApp: "Mash Piano ใช้ฟรีบน Mac และ Windows ด้วย ลูกน้อยได้เล่นบนแป้นพิมพ์คอมพิวเตอร์จริง และแป้นพิมพ์ทั้งหมดจะถูกล็อก"
