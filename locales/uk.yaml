appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "Після запуску піаніно займає весь екран і забирає всю клавіатуру. Що б не натиснуло маля, звучить м’яка нота піаніно, і ніщо не закриває застосунок, не перемикає програми й не викликає системних скорочень. Кожна клавіша має свою ноту: низькі внизу ліворуч, високі вгорі праворуч."
exitHow: "Щоб вийти: утримуйте мишу у правому верхньому куті екрана 3 секунди або наберіть quitpiano на клавіатурі."
exitHowTyped: "Щоб вийти: наберіть quitpiano на клавіатурі."
permissionMissing: "Щоб забрати клавіатуру, піаніно потрібен дозвіл Універсального доступу. Відкрийте налаштування й увімкніть Mash Piano — цей рядок сам стане зеленим."
permissionGranted: "Піаніно може забрати всю клавіатуру."
openSettings: "Відкрити параметри Універсального доступу"
soundLoading: "Завантажуємо піаніно…"
soundFailed: "Не вдалося ввімкнути звук: {error}. Перевірте виведення звуку й знову відкрийте піаніно."
volume: "Гучність"
volumeLocked: "Поки маля грає, клавіші гучності заблоковані, тож спершу налаштуйте її тут."
tryIt: "Послухати"
systemVolumeOver: "Гучність комп’ютера — {percent, number}%. Коли маля почне, вона знизиться до {cap, number}%, щоб берегти вушка."
systemVolumeOk: "Гучність комп’ютера — {percent, number}%, і поки маля грає, вона не перевищить {cap, number}%."
systemVolumeUnknown: "Гучність цього виходу прочитати неможливо, як у HDMI та деяких колонок. Переконайтеся, що не надто гучно."
start: "Почати грати (весь екран, клавіатура заблокована)"
secureInput: "Інший застосунок увімкнув захищене введення з клавіатури, наприклад у Терміналі чи в полі пароля, і тоді жоден застосунок не може заблокувати клавіатуру. Вимкніть його або перезавантажте комп’ютер і почніть знову."
lockFailed: "Не вдалося заблокувати клавіатуру. Перевірте, що Mash Piano увімкнено в Системних параметрах › Приватність і безпека › Універсальний доступ; після оновлення видаліть старий запис (−) і додайте його знову."
lockFailedWindows: "Не вдалося заблокувати клавіатуру. Закрийте Mash Piano і відкрийте знову; якщо не допоможе, перезапустіть комп’ютер."
windowsLimits: "Ctrl+Alt+Del не може заблокувати жоден застосунок; Win+L заблоковано, поки маля грає."
cornerHint: "Батькам: утримуйте правий верхній кут 3 секунди, щоб вийти"
touchIntro: "Кожен дотик або клавіша під’єднаної клавіатури грає м’яку ноту піаніно, і всі вони з одного ладу, що завжди звучить гарно."
touchLockIOS: "Щоб маля не вийшло з піаніно, увімкніть Гід-доступ: Параметри › Універсальний доступ › Гід-доступ, а тоді тричі натисніть бічну кнопку, поки грає піаніно."
touchLockAndroid: "Щоб маля не вийшло з піаніно, закріпіть його: Налаштування › Безпека › Закріплення додатка, а тоді закріпіть Mash Piano в нещодавніх додатках."
touchStart: "Почати грати"
scale: "Ноти"
scalePentatonic: "П’ять нот"
scalePentatonicNote: "До ре мі соль ля. Завжди звучить мило."
scaleMajor: "Сім нот"
scaleMajorNote: "Білі клавіші: до ре мі фа соль ля сі."
scaleChromatic: "Усі дванадцять"
scaleChromaticNote: "Білі й чорні клавіші, усі ноти."
visualsTitle: "Феєрверк"
visualsNote: "Кольоровий салют на кожну ноту. Не потрібен, якщо маля не бачить екрана."
noteNamesTitle: Назви нот на клавішах
noteNamesNote: Показує C D E F G A B на кожній клавіші, щоб вивчати ноти разом.
lockMouseTitle: "Заблокувати також мишу й трекпад"
lockMouseNote: "Радимо на ноутбуках. Вихід — набрати quitpiano."
keyboardOn: "Клавіатуру під’єднано"
keyboardOnNote: "Маля грає на клавіатурі, кожна клавіша — нота, як на комп’ютері."
keyboardOff: "Немає клавіатури"
keyboardOffNote: "Маля торкається великих кольорових клавіш на екрані. Під’єднайте клавіатуру, щоб грати на ній."
desktopApp: "Mash Piano безкоштовно є і для Mac та Windows: там маля грає на справжній клавіатурі комп’ютера, і вся клавіатура заблокована."
desktopAppLink: "Завантажити для Mac і Windows"

