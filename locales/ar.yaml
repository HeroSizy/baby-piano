appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "بعد البدء، يملأ البيانو الشاشة ويتولى لوحة المفاتيح بالكامل. أي مفتاح يضغطه الطفل يعزف نغمة بيانو هادئة، ولا شيء يُغلق التطبيق أو يبدّل التطبيقات أو يفتح اختصارات النظام. لكل مفتاح نغمته الخاصة: المنخفضة أسفل اليسار والعالية أعلى اليمين."
exitHow: "للإيقاف: اضغط بالماوس مع الاستمرار في الزاوية العلوية اليمنى من الشاشة لمدة 3 ثوانٍ، أو اكتب quitpiano على لوحة المفاتيح."
exitHowTyped: "للإيقاف: اكتب quitpiano على لوحة المفاتيح."
permissionMissing: "يحتاج البيانو إلى إذن تسهيلات الاستخدام ليتولى لوحة المفاتيح. افتح الإعداد وفعّل Mash Piano، وسيتحول هذا السطر إلى الأخضر تلقائيًا."
permissionGranted: "يمكن للبيانو أن يتولى لوحة المفاتيح بالكامل."
openSettings: "فتح إعدادات تسهيلات الاستخدام"
soundLoading: "جارٍ تحميل البيانو…"
soundFailed: "تعذّر تشغيل الصوت: {error}. تحقّق من مخرج الصوت، ثم افتح البيانو مرة أخرى."
volume: "مستوى الصوت"
volumeLocked: "تُقفل مفاتيح الصوت في لوحة المفاتيح أثناء لعب الطفل، لذا اضبطه هنا أولًا."
tryIt: "جرّب"
systemVolumeOver: "مستوى صوت الكمبيوتر {percent, number}%. سينخفض إلى {cap, number}% عندما يبدأ الطفل، لحماية أذنيه."
systemVolumeOk: "مستوى صوت الكمبيوتر {percent, number}%، ويبقى عند {cap, number}% أو أقل أثناء لعب الطفل."
systemVolumeUnknown: "لا يمكن قراءة مستوى صوت هذا المخرج، كما في HDMI وبعض السماعات. تأكّد أنه ليس مرتفعًا جدًا."
start: "ابدأ العزف (ملء الشاشة، لوحة المفاتيح مقفلة)"
secureInput: "شغّل تطبيق آخر إدخال لوحة المفاتيح الآمن، مثل الذي في تطبيق Terminal أو حقل كلمة سر، وعندها لا يستطيع أي تطبيق قفل لوحة المفاتيح. أوقفه أو أعد تشغيل الكمبيوتر، ثم ابدأ من جديد."
lockFailed: "تعذّر قفل لوحة المفاتيح. تحقّق من تفعيل Mash Piano في إعدادات النظام › الخصوصية والأمن › تسهيلات الاستخدام؛ وبعد التحديث، احذف الإدخال القديم (−) ثم أضفه مجددًا."
windowsLimits: "لا يمكن لأي تطبيق منع Ctrl+Alt+Del؛ ويُمنع Win+L أثناء لعب الطفل."
cornerHint: "للأهل: اضغطوا مع الاستمرار على الزاوية العلوية اليمنى 3 ثوانٍ للإيقاف"
touchIntro: "كل لمسة، أو كل مفتاح في لوحة مفاتيح موصولة، يعزف نغمة بيانو هادئة، وكلها من سلّم يبدو جميلًا دائمًا."
touchLockIOS: "لإبقاء الطفل داخل البيانو، شغّل الوصول الموجّه: الإعدادات › تسهيلات الاستخدام › الوصول الموجّه، ثم اضغط الزر الجانبي ثلاث مرات أثناء عزف البيانو."
touchLockAndroid: "لإبقاء الطفل داخل البيانو، ثبّته: الإعدادات › الأمان › تثبيت التطبيق، ثم ثبّت Mash Piano من التطبيقات الحديثة."
touchStart: "ابدأ العزف"
scale: "النغمات"
scalePentatonic: "خمس نغمات"
scalePentatonicNote: "دو ري مي صول لا. جميلة دائمًا."
scaleMajor: "سبع نغمات"
scaleMajorNote: "المفاتيح البيضاء: دو ري مي فا صول لا سي."
scaleChromatic: "الاثنتا عشرة كلها"
scaleChromaticNote: "المفاتيح البيضاء والسوداء، كل النغمات."
visualsTitle: "ألعاب نارية"
visualsNote: "انفجار ملوّن مع كل نغمة. لا حاجة إليه إن كان الطفل لا يرى الشاشة."
noteNamesTitle: أسماء النوتات على المفاتيح
noteNamesNote: تظهر C D E F G A B على كل مفتاح، لتتعلّما النوتات معًا.
lockMouseTitle: "اقفل الماوس ولوحة التعقب أيضًا"
lockMouseNote: "يُنصح به على أجهزة اللابتوب. وللإيقاف حينها اكتب quitpiano."
keyboardOn: "لوحة المفاتيح متصلة"
keyboardOnNote: "يعزف الطفل على لوحة المفاتيح، لكل مفتاح نغمة، كما على الكمبيوتر."
keyboardOff: "لا توجد لوحة مفاتيح"
keyboardOffNote: "يلمس الطفل المفاتيح الملوّنة الكبيرة على الشاشة. صِل لوحة مفاتيح ليعزف عليها بدلًا من ذلك."
desktopApp: "Mash Piano مجاني أيضًا على Mac وWindows، حيث يعزف الطفل على لوحة مفاتيح كمبيوتر حقيقية وتُقفل لوحة المفاتيح بالكامل."
desktopAppLink: "التنزيل لـ Mac وWindows"

