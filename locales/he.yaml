appName: "Mash Piano"
title: "Mash Piano"
desktopIntro: "אחרי ההפעלה הפסנתר ממלא את המסך ומשתלט על כל המקלדת. כל מקש שהתינוק לוחץ מנגן צליל פסנתר רך, ושום דבר לא סוגר את היישום, לא מחליף יישומים ולא פותח קיצורי מערכת. לכל מקש צליל משלו: נמוך למטה משמאל וגבוה למעלה מימין."
exitHow: "כדי לעצור: החזיקו את העכבר בפינה הימנית העליונה של המסך במשך 3 שניות, או הקלידו quitpiano במקלדת."
exitHowTyped: "כדי לעצור: הקלידו quitpiano במקלדת."
permissionMissing: "הפסנתר צריך את הרשאת הנגישות כדי להשתלט על המקלדת. פתחו את ההגדרה והפעילו את Mash Piano; השורה הזו תהפוך לירוקה מעצמה."
permissionGranted: "הפסנתר יכול להשתלט על כל המקלדת."
openSettings: "פתיחת הגדרות הנגישות"
soundLoading: "טוען את הפסנתר…"
soundFailed: "לא ניתן היה להפעיל את הצליל: {error}. בדקו את יציאת השמע ופתחו שוב את הפסנתר."
volume: "עוצמת קול"
volumeLocked: "מקשי עוצמת הקול במקלדת נעולים בזמן שהתינוק מנגן, לכן כוונו אותה כאן קודם."
tryIt: "נסו"
systemVolumeOver: "עוצמת הקול של המחשב היא {percent, number}%. היא תרד ל-{cap, number}% כשהתינוק יתחיל, כדי להגן על האוזניים."
systemVolumeOk: "עוצמת הקול של המחשב היא {percent, number}%, והיא נשארת על {cap, number}% או פחות בזמן שהתינוק מנגן."
systemVolumeUnknown: "אי אפשר לקרוא את עוצמת הקול של יציאה זו, כמו ב-HDMI ובחלק מהרמקולים. ודאו שהיא לא חזקה מדי."
start: "להתחיל לנגן (מסך מלא, מקלדת נעולה)"
secureInput: "יישום אחר הפעיל הזנת מקלדת מאובטחת, כמו ב-Terminal או בשדה סיסמה, ואז אף יישום לא יכול לנעול את המקלדת. כבו אותה או הפעילו מחדש את המחשב, ואז התחילו שוב."
lockFailed: "לא ניתן היה לנעול את המקלדת. ודאו ש-Mash Piano מופעל בהגדרות המערכת › פרטיות ואבטחה › נגישות; אחרי עדכון, הסירו את הרשומה הישנה (−) והוסיפו אותה מחדש."
windowsLimits: "אף יישום לא יכול לחסום את Ctrl+Alt+Del; ‏Win+L חסום בזמן שהתינוק מנגן."
cornerHint: "להורים: החזיקו את הפינה הימנית העליונה 3 שניות כדי לעצור"
touchIntro: "כל נגיעה, או כל מקש במקלדת מחוברת, מנגנים צליל פסנתר רך, וכולם מסולם שתמיד נשמע יפה ביחד."
touchLockIOS: "כדי שהתינוק יישאר בפסנתר, הפעילו גישה מודרכת: הגדרות › נגישות › גישה מודרכת, ואז לחצו שלוש פעמים על הכפתור הצדדי בזמן שהפסנתר מנגן."
touchLockAndroid: "כדי שהתינוק יישאר בפסנתר, הצמידו אותו: הגדרות › אבטחה › הצמדת אפליקציה, ואז הצמידו את Mash Piano מתוך האפליקציות האחרונות."
touchStart: "להתחיל לנגן"
scale: "צלילים"
scalePentatonic: "חמישה צלילים"
scalePentatonicNote: "דו רה מי סול לה. תמיד נשמע מקסים."
scaleMajor: "שבעה צלילים"
scaleMajorNote: "הקלידים הלבנים, דו רה מי פה סול לה סי."
scaleChromatic: "כל השנים־עשר"
scaleChromaticNote: "קלידים לבנים ושחורים, כל צליל."
visualsTitle: "זיקוקים"
visualsNote: "פרץ צבעוני לכל צליל. לא נחוץ אם התינוק לא רואה את המסך."
lockMouseTitle: "לנעול גם את העכבר ומשטח המגע"
lockMouseNote: "מומלץ במחשבים ניידים. כדי לעצור, הקלידו quitpiano."
keyboardOn: "מקלדת מחוברת"
keyboardOnNote: "התינוק מנגן על המקלדת, כל מקש צליל, כמו במחשב."
keyboardOff: "אין מקלדת"
keyboardOffNote: "התינוק נוגע בקלידים הצבעוניים הגדולים שעל המסך. חברו מקלדת כדי לנגן עליה."
desktopApp: "Mash Piano זמין בחינם גם ל-Mac ול-Windows, שם התינוק מנגן על מקלדת מחשב אמיתית וכל המקלדת נעולה."
desktopAppLink: "הורדה ל-Mac ול-Windows"

