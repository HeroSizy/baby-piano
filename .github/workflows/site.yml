# mashpiano.herosizy.dev: deploys site/ (a Cloudflare Worker with static
# assets) when it changes on main, or when run by hand. The download
# buttons follow the latest GitHub Release by themselves, so a new app
# release needs no deploy.
#
# Needs the secrets CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers"
# template, with the herosizy.dev zone) and CLOUDFLARE_ACCOUNT_ID.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          npx wrangler deploy
      - name: Check
        run: |
          sleep 5
          curl -fsS -o /dev/null https://mashpiano.herosizy.dev/
          curl -fsS https://mashpiano.herosizy.dev/api/latest
