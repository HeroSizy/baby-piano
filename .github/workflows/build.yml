name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 键位、限流、界面和退出方式的测试（NSGo 无头测试）。
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go tool nsgo test ./...

  # Windows 真机：编译检查，并跑 NSGo 在 Windows 上解码、播放声音的测试（XAudio2 + Media Foundation）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: NSGo sounds on Windows
        run: go test -v -run TestWindowsAudio github.com/nsgo-dev/nsgo/internal/platform/windows

  build:
    needs: [test, windows]
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: NSIS for the Windows installers
        run: brew install makensis

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # ---- 正式签名（可选）：仓库 Secrets 里配置了 Developer ID 证书才会执行 ----
      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # Developer ID 中间证书，保证证书链完整
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$IDENTITY"
          echo "SIGN_ARGS=-sign $IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      # ---- 公证（可选，仅发布标签）：需要正式证书 + Apple ID 应用专用密码 ----
      - name: Notary profile
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'HK2CBGL2Q2' }}
        run: |
          xcrun notarytool store-credentials babypiano --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --keychain "$RUNNER_TEMP/build.keychain-db"
          echo "SIGN_ARGS=$SIGN_ARGS -notarize babypiano" >> "$GITHUB_ENV"

      # Mac（Apple 芯片 + Intel）、Windows（x64 + ARM）和 Android 的安装包；
      # iPhone/iPad 需要描述文件才能装到设备上，这里只编译检查。
      - name: Build
        run: |
          go tool nsgo build -version "${{ steps.ver.outputs.version }}" \
            -target macos_arm64,macos_x64,windows_x64,windows_arm64,android_arm64 $SIGN_ARGS
          go tool nsgo build -version "${{ steps.ver.outputs.version }}" -target ios -installers=false
          ls -la dist/releases

      - uses: actions/upload-artifact@v4
        with:
          name: BabyPiano-${{ steps.ver.outputs.version }}
          path: |
            dist/releases/*.dmg
            dist/releases/*.exe
            dist/releases/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/*.dmg
            dist/releases/*.exe
            dist/releases/*.apk
          body: |
            ## 下载
            - **Mac**：`macos-arm64.dmg`（Apple 芯片）或 `macos-x64.dmg`（Intel）。打开后把「宝宝钢琴」拖进「应用程序」。
            - **Windows**：`windows-x64-setup.exe`（大多数电脑）或 `windows-arm64-setup.exe`（ARM 电脑）。
            - **Android 手机/平板**：`android-arm64.apk`。
            - **iPhone / iPad**：用 Xcode 自己装，见 README。

            Mac 签名方式：${{ env.HAS_CERT == 'true' && (env.HAS_NOTARY == 'true' && 'Developer ID 签名 + Apple 公证，双击即可打开。' || 'Developer ID 签名（未公证）。') || '本机自签名（ad-hoc）。第一次打开会提示“无法验证开发者”，请看 README 里的“第一次打开”。' }}

            使用说明见 [README](https://github.com/${{ github.repository }}#readme)。
