name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Key map, rate limit, screens and the ways out (NSGo headless tests).
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go tool nsgo test ./...

  # On real Windows: vet, and NSGo's test of decoding and playing sound there (XAudio2 + Media Foundation).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: NSGo sounds on Windows
        run: go test -v -run TestWindowsAudio github.com/nsgo-dev/nsgo/internal/platform/windows

  build:
    needs: [test, windows]
    runs-on: macos-latest
    permissions:
      contents: write # a release creates the tag and the GitHub Release
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_NOTARY_PW: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAS_IOS_STORE: ${{ secrets.IOS_DIST_CERT_P12 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_PROFILE != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_NOTARY: ${{ (secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '') || (secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: NSIS for the Windows installers
        run: brew install makensis

      - name: Version
        id: ver
        run: |
          # A release: a pushed v* tag, or main carrying an nsgo.yaml version that has no tag yet.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(awk '/^version:/ {print $2; exit}' nsgo.yaml)
          if [[ "$GITHUB_REF" == refs/heads/main && -n "$V" && -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Signing (optional): runs only when the Developer ID certificate secrets are set ----
      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # The Developer ID intermediate certificate, so the chain is complete
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$IDENTITY"
          echo "SIGN_ARGS=-sign $IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      # ---- Notarization (optional, releases only): needs the certificate and one of two credentials ----
      # Preferred: an App Store Connect API key (no password); otherwise an Apple ID with an app-specific password.
      - name: Notary key (App Store Connect API key)
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY_KEY == 'true' && steps.ver.outputs.release == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # NSGo notarizes by itself: with these three variables nsgo build submits, waits and staples the ticket.
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          {
            echo "NSGO_NOTARY_KEY=$KEY"
            echo "NSGO_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NSGO_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Notary profile (Apple ID)
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY_KEY != 'true' && env.HAS_NOTARY_PW == 'true' && steps.ver.outputs.release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'HK2CBGL2Q2' }}
        run: |
          xcrun notarytool store-credentials babypiano --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --keychain "$RUNNER_TEMP/build.keychain-db"
          echo "SIGN_ARGS=$SIGN_ARGS -notarize babypiano" >> "$GITHUB_ENV"

      # Packages for Mac (Apple silicon + Intel), Windows (x64 + ARM) and Android;
      # iPhone and iPad need a provisioning profile to install, so they are only compiled here.
      - name: Build
        run: |
          go tool nsgo build -version "${{ steps.ver.outputs.version }}" \
            -target macos_arm64,macos_x64,windows_x64,windows_arm64,android_arm64 $SIGN_ARGS
          # Only the Mac is notarized; NSGo asks for a Developer ID whenever NSGO_NOTARY_KEY is set, so drop it here.
          env -u NSGO_NOTARY_KEY go tool nsgo build -version "${{ steps.ver.outputs.version }}" -target ios -installers=false
          ls -la dist/releases

      # ---- App Store (optional, releases only): sign the iPhone/iPad package and upload it ----
      # Only uploads the build to App Store Connect; submitting it for review stays a manual step.
      - name: iOS App Store build and upload
        if: env.HAS_IOS_STORE == 'true' && steps.ver.outputs.release == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # A keychain of its own for the Apple Distribution certificate, unlocked for codesign with no prompt.
          KEYCHAIN="$RUNNER_TEMP/store.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/dist.p12"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # The App Store provisioning profile; NSGo embeds it and signs with the keychain's matching identity.
          PROFILE="$RUNNER_TEMP/MashPiano_AppStore.mobileprovision"
          echo "$IOS_PROFILE" | base64 --decode > "$PROFILE"

          # Each upload needs a build number above the last one; the workflow run number always grows.
          env -u NSGO_NOTARY_KEY go tool nsgo build -version "${{ steps.ver.outputs.version }}" \
            -build-number "$((GITHUB_RUN_NUMBER + 100))" -target ios -profile "$PROFILE"
          IPA=$(ls dist/releases/*-ios.ipa | head -1)
          test -n "$IPA"

          # altool finds the API key as private_keys/AuthKey_<KEY ID>.p8.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 "$PROFILE"

      - uses: actions/upload-artifact@v4
        with:
          name: BabyPiano-${{ steps.ver.outputs.version }}
          path: |
            dist/releases/*.dmg
            dist/releases/*.exe
            dist/releases/*.apk

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mash Piano ${{ steps.ver.outputs.version }}
          files: |
            dist/releases/*.dmg
            dist/releases/*.exe
            dist/releases/*.apk
          body: |
            ## Download
            - **Mac**: `macos-arm64.dmg` (Apple silicon) or `macos-x64.dmg` (Intel). Open it and drag Mash Piano into Applications.
            - **Windows**: `windows-x64-setup.exe` (most PCs) or `windows-arm64-setup.exe` (ARM PCs).
            - **Android phones and tablets**: `android-arm64.apk`.
            - **iPhone / iPad**: on the App Store (search for Mash Piano).

            Mac signing: ${{ env.HAS_CERT == 'true' && (env.HAS_NOTARY == 'true' && 'signed with a Developer ID and notarized by Apple, so it opens with a double-click.' || 'signed with a Developer ID, not notarized.') || 'ad-hoc signed. The first launch says the developer cannot be verified: open System Settings › Privacy & Security and choose Open Anyway.' }}

            How to use it: [README](https://github.com/${{ github.repository }}#readme).
