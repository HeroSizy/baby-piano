promo: "Каждое касание — мягкая нота пианино в ладу, который всегда звучит красиво. Без рекламы, без аккаунтов, без интернета: просто музыка для маленьких пальчиков."
whatsNew: "Теперь на 25 языках — по языку системы."
description: |
  Mash Piano появилось благодаря старой механической клавиатуре у нас дома. Малыш обожал по ней хлопать, и мы сделали так, чтобы она играла музыку.

  Дайте малышу iPhone или iPad: экран превращается в ряды больших ярких клавиш, и каждое касание звучит мягкой нотой рояля. Все ноты из одной пентатоники, поэтому что бы ни делали маленькие ручки, звучит всегда приятно.

  • Большие цветные клавиши на весь экран — для младенцев и малышей
  • Можно играть всеми пальцами сразу
  • Настоящий звук рояля (Salamander Grand Piano)
  • Бережно к маленьким ушам: высокие ноты тише, а шлепок по многим клавишам играет лишь несколько
  • Цветной фейерверк под каждым пальчиком
  • Во время игры — весь экран, строка состояния и края не мешают
  • Без рекламы, встроенных покупок и аккаунтов, без сбора данных, работает офлайн

  Чтобы малыш не вышел из приложения, включите Гид-доступ (Настройки › Универсальный доступ › Гид-доступ) и трижды нажмите боковую кнопку, пока играет пианино.

  Взрослым: удерживайте правый верхний угол 3 секунды, чтобы вернуться в настройки.

  Также бесплатно для Mac и Windows: лишняя клавиатура становится пианино, которое не закрывается, не переключает приложения и не открывает сочетания клавиш: https://mashpiano.herosizy.dev
