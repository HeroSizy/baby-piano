subtitle: "아기 손을 위한 안전한 피아노"
keywords: "아기,유아,영아,어린이,피아노,음악,장난감,키보드,소리,색깔,탭,감각,놀이"
promo: "탭할 때마다 부드러운 피아노 음. 모두 같은 음계라 언제나 잘 어울립니다. 광고 없음, 계정 없음, 인터넷 없음. 작은 손가락을 위한 음악."
whatsNew: "이제 25개 언어를 지원하며, 시스템 언어를 따라갑니다."
description: |
  Mash Piano는 집에 있던 오래된 기계식 키보드에서 시작되었습니다. 아기가 그 키보드를 두드리는 걸 너무 좋아해서, 음악이 나오게 만들었어요.

  iPhone이나 iPad를 아기에게 건네주세요. 화면이 크고 밝은 건반으로 바뀌고, 탭할 때마다 부드러운 그랜드 피아노 음이 납니다. 모든 음이 하나의 5음 음계에서 나오기 때문에 작은 손이 무엇을 해도 듣기 좋게 어울립니다.

  • 화면을 가득 채우는 크고 알록달록한 건반, 아기와 유아를 위해
  • 모든 손가락으로 한꺼번에 연주
  • 진짜 그랜드 피아노 소리 (Salamander Grand Piano)
  • 작은 귀에 부드럽게: 높은 음은 더 작게, 여러 건반을 한 번에 쳐도 몇 개만 소리 남
  • 손가락마다 알록달록한 불꽃놀이
  • 연주 중에는 전체 화면, 상태 막대와 가장자리 제스처가 방해하지 않음
  • 광고 없음, 앱 내 구입 없음, 계정 없음, 데이터 수집 없음, 오프라인 작동

  아이가 앱에서 나가지 않게 하려면 '사용법 유도'를 켜고(설정 › 손쉬운 사용 › 사용법 유도), 피아노가 연주되는 동안 측면 버튼을 세 번 누르세요.

  부모님: 오른쪽 위 모서리를 3초간 누르면 설정으로 돌아갑니다.

  Mac과 Windows에서도 무료입니다. 남는 키보드를 종료, 앱 전환, 단축키가 통하지 않는 피아노로 바꿔 줍니다: https://mashpiano.herosizy.dev
