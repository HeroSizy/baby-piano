promo: "Każde dotknięcie to łagodna nuta pianina w skali, która zawsze brzmi ładnie. Bez reklam, bez kont, bez internetu: tylko muzyka dla małych paluszków."
whatsNew: "Teraz w 25 językach, zgodnie z językiem systemu."
description: |
  Mash Piano zaczęło się od starej mechanicznej klawiatury w domu. Nasz maluch uwielbiał w nią walić, więc sprawiliśmy, że gra muzykę.

  Daj maluchowi iPhone’a lub iPada: ekran zamienia się w rzędy dużych, jasnych klawiszy, a każde dotknięcie gra miękką nutę fortepianu. Wszystkie nuty pochodzą z jednej skali pentatonicznej, więc cokolwiek zrobią małe rączki, zawsze brzmi przyjemnie.

  • Duże kolorowe klawisze na cały ekran, dla niemowląt i maluchów
  • Gra wszystkimi palcami naraz
  • Prawdziwy dźwięk fortepianu (Salamander Grand Piano)
  • Łagodne dla małych uszu: wysokie nuty są cichsze, a klepnięcie w wiele klawiszy gra tylko kilka
  • Kolorowe fajerwerki pod każdym paluszkiem
  • Pełny ekran podczas gry, pasek stanu i krawędzie nie przeszkadzają
  • Bez reklam, zakupów w aplikacji i kont, bez zbierania danych, działa offline

  Aby dziecko nie wyszło z aplikacji, włącz Dostęp nadzorowany (Ustawienia › Dostępność › Dostęp nadzorowany) i naciśnij trzy razy przycisk boczny, gdy pianino gra.

  Rodzice: przytrzymajcie prawy górny róg przez 3 sekundy, aby wrócić do ustawień.

  Także za darmo na Maca i Windows: zapasowa klawiatura staje się pianinem, które się nie zamyka, nie przełącza aplikacji i nie otwiera skrótów: https://mashpiano.herosizy.dev
