subtitle: "给宝宝小手的安全钢琴"
keywords: "宝宝,婴儿,幼儿,钢琴,早教,音乐,玩具,键盘,儿歌,声音,颜色,启蒙,敲击,感官"
promo: "每一下都是轻柔的钢琴声，所有音都在同一个五声音阶里，怎么按都好听。没有广告、不用登录、不联网。"
whatsNew: "现在支持 25 种语言，跟随系统语言自动切换。"
description: |
  Mash Piano 的灵感来自家里一个旧机械键盘。宝宝特别爱拍它，于是我们让它弹出音乐。

  把 iPhone 或 iPad 交给宝宝：屏幕变成一排排又大又亮的琴键，每按一下都是一声柔和的三角钢琴音。所有音都来自同一个五声音阶，小手怎么乱按，听起来都和谐。

  • 铺满屏幕的大彩色琴键，专为婴幼儿设计
  • 可以多个手指同时弹
  • 真实三角钢琴采样（Salamander Grand Piano）
  • 保护小耳朵：高音更轻，一巴掌按很多键也只响几个
  • 每个手指按下都会绽放一朵彩色烟花
  • 弹琴时全屏，状态栏和边缘手势不碍事
  • 无广告、无内购、无需账号、不收集任何数据、可离线使用

  想让宝宝出不去：打开“引导式访问”（设置 › 辅助功能 › 引导式访问），弹琴时连按三下侧边按钮。

  家长：按住右上角 3 秒回到设置页。

  Mac 和 Windows 也有免费版，把闲置的键盘变成一台不会退出、不会切换程序、不会触发快捷键的钢琴：https://mashpiano.herosizy.dev
