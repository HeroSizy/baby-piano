promo: "Jokainen napautus on pehmeä pianon sävel asteikossa, joka kuulostaa aina kauniilta. Ei mainoksia, ei tiliä, ei nettiä: vain musiikkia pienille sormille."
whatsNew: "Nyt 25 kielellä järjestelmän kielen mukaan."
description: |
  Mash Piano sai alkunsa kotimme vanhasta mekaanisesta näppäimistöstä. Vauvamme rakasti läiskiä sitä, joten saimme sen soittamaan musiikkia.

  Anna iPhone tai iPad pienelle: näyttö muuttuu riveiksi isoja, kirkkaita koskettimia, ja jokainen napautus soittaa pehmeän flyygelin sävelen. Kaikki sävelet ovat samasta pentatonisesta asteikosta, joten mitä pienet kädet tekevätkin, kuulostaa aina mukavalta.

  • Isot värikkäät koskettimet koko näytöllä, vauvoille ja taaperoille
  • Soita kaikilla sormilla yhtä aikaa
  • Aito flyygelin ääni (Salamander Grand Piano)
  • Hellä pienille korville: korkeat sävelet ovat hiljaisempia, ja läimäys moneen koskettimeen soittaa vain muutaman
  • Värikäs ilotulitus jokaisen sormen alla
  • Koko näyttö soittaessa, tilarivi ja reunat eivät häiritse
  • Ei mainoksia, sovelluksen sisäisiä ostoja eikä tiliä, ei tiedonkeruuta, toimii offline

  Pidä lapsi sovelluksessa Ohjatulla käytöllä (Asetukset › Käyttöapu › Ohjattu käyttö) ja paina sivupainiketta kolmesti pianon soidessa.

  Vanhemmat: pidä oikeaa yläkulmaa 3 sekuntia palataksesi asetuksiin.

  Ilmainen myös Macille ja Windowsille: ylimääräisestä näppäimistöstä tulee piano, joka ei sulkeudu, vaihda sovellusta eikä avaa pikanäppäimiä: https://mashpiano.herosizy.dev
