subtitle: "Piano seguro para mãozinhas"
keywords: "bebê,criança,infantil,teclado,brinquedo,música,som,primeiro,notas,cores,sensorial,calma,tocar"
promo: "Cada toque é uma nota suave de piano, numa escala que sempre soa bem. Sem anúncios, sem contas, sem internet: só música para dedinhos."
whatsNew: "Agora em 25 idiomas, conforme o idioma do sistema."
description: |
  O Mash Piano nasceu de um teclado mecânico antigo aqui de casa. Nosso bebê adorava bater nele, então fizemos ele tocar música.

  Entregue seu iPhone ou iPad para o pequeno: a tela vira fileiras de teclas grandes e coloridas, e cada toque soa como uma nota suave de piano de cauda. Todas as notas vêm de uma mesma escala pentatônica, então, seja o que for que as mãozinhas façam, sempre soa agradável.

  • Teclas grandes e coloridas que enchem a tela, feitas para bebês e crianças pequenas
  • Dá para tocar com todos os dedos ao mesmo tempo
  • Som real de piano de cauda (Salamander Grand Piano)
  • Suave para ouvidos pequenos: as notas agudas são mais baixas, e um tapa em muitas teclas toca só algumas
  • Fogos de artifício coloridos em cada dedo
  • Tela cheia enquanto toca, sem barra de status nem bordas atrapalhando
  • Sem anúncios, sem compras no app, sem conta, nenhum dado coletado, funciona offline

  Para manter a criança no app, ative o Acesso Guiado (Ajustes › Acessibilidade › Acesso Guiado) e clique três vezes no botão lateral enquanto o piano toca.

  Adultos: segurem o canto superior direito por 3 segundos para voltar aos ajustes.

  Também grátis para Mac e Windows, onde transforma um teclado sobrando num piano que não fecha, não troca de app nem abre atalhos: https://mashpiano.herosizy.dev
