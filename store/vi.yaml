locales: [vi]
subtitle: "Đàn piano an toàn cho bé"
keywords: "em bé,trẻ em,trẻ nhỏ,đàn,bàn phím,đồ chơi,âm nhạc,âm thanh,nốt,màu sắc"
promo: "Mỗi lần chạm là một nốt piano êm dịu trong thang âm luôn nghe hay. Không quảng cáo, không tài khoản, không internet: chỉ có âm nhạc cho những ngón tay nhỏ."
whatsNew: "Giờ đã có 25 ngôn ngữ, theo ngôn ngữ hệ thống."
description: |
  Mash Piano bắt đầu từ một chiếc bàn phím cơ cũ ở nhà. Bé nhà mình rất thích đập vào nó, nên chúng mình làm cho nó phát ra âm nhạc.

  Đưa iPhone hoặc iPad cho bé: màn hình biến thành những hàng phím lớn, sáng màu, và mỗi lần chạm vang lên một nốt đại dương cầm êm dịu. Mọi nốt đều thuộc cùng một thang âm ngũ cung, nên dù đôi tay nhỏ làm gì, âm thanh vẫn luôn hài hòa.

  • Phím lớn nhiều màu phủ kín màn hình, dành cho trẻ sơ sinh và trẻ nhỏ
  • Chơi bằng tất cả các ngón cùng lúc
  • Âm thanh đại dương cầm thật (Salamander Grand Piano)
  • Nhẹ nhàng với đôi tai nhỏ: nốt cao nhỏ hơn, và vỗ lên nhiều phím chỉ kêu vài nốt
  • Pháo hoa rực rỡ dưới mỗi ngón tay
  • Toàn màn hình khi chơi, thanh trạng thái và mép màn hình không gây vướng
  • Không quảng cáo, không mua trong ứng dụng, không tài khoản, không thu thập dữ liệu, chạy ngoại tuyến

  Để bé không thoát khỏi ứng dụng, hãy bật Truy cập được hướng dẫn (Cài đặt › Trợ năng › Truy cập được hướng dẫn) rồi bấm ba lần nút sườn khi đàn đang chơi.

  Phụ huynh: giữ góc trên bên phải 3 giây để quay lại cài đặt.

  Cũng miễn phí cho Mac và Windows, biến một bàn phím dư thành cây đàn không thoát, không chuyển ứng dụng và không mở phím tắt: https://mashpiano.herosizy.dev
