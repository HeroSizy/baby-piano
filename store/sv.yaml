subtitle: "Bebissäkert piano"
keywords: "bebis,barn,småbarn,tangentbord,leksak,musik,ljud,första,toner,färger,sensorisk,lugn,tryck"
promo: "Varje tryck är en mjuk pianoton i en skala som alltid låter fint. Ingen reklam, inget konto, inget internet: bara musik för små fingrar."
whatsNew: "Nu på 25 språk, efter systemets språk."
description: |
  Mash Piano började med ett gammalt mekaniskt tangentbord hemma. Vår bebis älskade att slå på det, så vi fick det att spela musik.

  Ge din iPhone eller iPad till den lilla: skärmen blir rader av stora, klara tangenter, och varje tryck spelar en mjuk flygelton. Alla toner kommer från en och samma pentatoniska skala, så vad små händer än gör låter det alltid fint ihop.

  • Stora färgglada tangenter som fyller skärmen, gjorda för bebisar och småbarn
  • Spela med alla fingrar samtidigt
  • Äkta flygelljud (Salamander Grand Piano)
  • Snällt mot små öron: höga toner är svagare, och ett slag på många tangenter spelar bara några
  • Ett färgglatt fyrverkeri under varje finger
  • Helskärm när det spelas, utan statusfält eller kanter i vägen
  • Ingen reklam, inga köp i appen, inget konto, ingen datainsamling, fungerar offline

  För att hålla barnet kvar i appen slår du på Guidad åtkomst (Inställningar › Hjälpmedel › Guidad åtkomst) och trycker tre gånger på sidoknappen medan pianot spelar.

  Föräldrar: håll det övre högra hörnet i 3 sekunder för att komma tillbaka till inställningarna.

  Finns också gratis för Mac och Windows, där ett extra tangentbord blir ett piano som inte avslutas, inte byter app och inte öppnar kortkommandon: https://mashpiano.herosizy.dev
