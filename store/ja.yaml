promo: "タップするたびにやさしいピアノの音。すべて同じ音階なので、いつもきれいに響きます。広告なし、アカウント不要、ネット接続なし。"
whatsNew: "25 の言語に対応しました。システムの言語に合わせて表示されます。"
description: |
  Mash Piano は、家にあった古いメカニカルキーボードから生まれました。赤ちゃんがそれをたたくのが大好きだったので、音楽が鳴るようにしたのです。

  iPhone や iPad を赤ちゃんに渡すと、画面が大きくて明るい鍵盤の列になり、タップするたびにやわらかなグランドピアノの音が鳴ります。音はすべて同じペンタトニックスケールなので、小さな手が何をしても心地よく響きます。

  • 画面いっぱいの大きなカラフルな鍵盤。赤ちゃんや幼児のために
  • すべての指で同時に弾ける
  • 本物のグランドピアノの音（Salamander Grand Piano）
  • 小さな耳にやさしく：高い音はひかえめ、たくさんのキーをたたいても鳴るのは少しだけ
  • 指ごとにカラフルな花火
  • 演奏中は全画面。ステータスバーや画面端のジェスチャーも邪魔しません
  • 広告なし、App 内課金なし、アカウント不要、データ収集なし、オフラインで動作

  赤ちゃんがアプリから出ないようにするには「アクセスガイド」をオンに（設定 › アクセシビリティ › アクセスガイド）。ピアノが鳴っている間にサイドボタンをトリプルクリックします。

  保護者の方へ：右上隅を 3 秒押すと設定に戻ります。

  Mac と Windows 版も無料。余ったキーボードを、終了もアプリ切り替えもショートカットも起きないピアノに変えます：https://mashpiano.herosizy.dev
