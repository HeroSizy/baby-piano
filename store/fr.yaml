locales: [fr-FR, fr-CA]
subtitle: "Piano sûr pour petites mains"
keywords: "bébé,enfant,tout-petit,clavier,jouet,musique,son,éveil,notes,couleurs,sensoriel,calme,taper"
promo: "Chaque toucher joue une douce note de piano, dans une gamme qui sonne toujours juste. Sans pub, sans compte, sans internet : juste de la musique pour petits doigts."
whatsNew: "Désormais en 25 langues, selon la langue du système."
description: |
  Mash Piano est né d’un vieux clavier mécanique à la maison. Notre bébé adorait taper dessus, alors nous l’avons fait jouer de la musique.

  Donnez votre iPhone ou iPad à votre tout-petit : l’écran devient des rangées de grandes touches lumineuses, et chaque toucher joue une douce note de piano à queue. Toutes les notes viennent d’une même gamme pentatonique : quoi que fassent les petites mains, cela sonne toujours bien.

  • De grandes touches colorées qui remplissent l’écran, pensées pour les bébés et les tout-petits
  • On peut jouer avec tous les doigts à la fois
  • Un vrai son de piano à queue (Salamander Grand Piano)
  • Doux pour les petites oreilles : les aigus sont plus doux, et une tape sur plein de touches n’en joue que quelques-unes
  • Un feu d’artifice de couleurs sous chaque doigt
  • Plein écran pendant le jeu, sans barre d’état ni bords qui gênent
  • Sans pub, sans achat intégré, sans compte, aucune donnée collectée, fonctionne hors ligne

  Pour garder votre enfant dans l’app, activez l’Accès guidé (Réglages › Accessibilité › Accès guidé), puis cliquez trois fois sur le bouton latéral pendant que le piano joue.

  Parents : maintenez le coin supérieur droit 3 secondes pour revenir aux réglages.

  Aussi gratuit sur Mac et Windows, où il transforme un clavier inutilisé en piano qui ne quitte pas, ne change pas d’app et n’ouvre aucun raccourci : https://mashpiano.herosizy.dev
