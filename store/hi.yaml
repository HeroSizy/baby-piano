subtitle: "बच्चों के लिए सुरक्षित पियानो"
keywords: "बच्चा,शिशु,बेबी,पियानो,कीबोर्ड"
promo: "हर टैप एक मधुर पियानो सुर है, ऐसे सरगम में जो हमेशा अच्छा लगता है। कोई विज्ञापन नहीं, कोई खाता नहीं, कोई इंटरनेट नहीं: बस नन्ही उँगलियों के लिए संगीत।"
whatsNew: "अब 25 भाषाओं में, सिस्टम की भाषा के अनुसार।"
description: |
  Mash Piano की शुरुआत घर के एक पुराने मैकेनिकल कीबोर्ड से हुई। हमारे बच्चे को उस पर थपकी मारना बहुत पसंद था, तो हमने उससे संगीत बजवाया।

  अपना iPhone या iPad नन्हे को दें: स्क्रीन बड़ी, चमकीली कुंजियों की कतारों में बदल जाती है, और हर टैप पर ग्रैंड पियानो का एक कोमल सुर बजता है। सभी सुर एक ही पेंटाटोनिक सरगम से हैं, इसलिए नन्हे हाथ कुछ भी करें, हमेशा मधुर लगता है।

  • स्क्रीन भरने वाली बड़ी रंगीन कुंजियाँ, शिशुओं और छोटे बच्चों के लिए
  • सभी उँगलियों से एक साथ बजाएँ
  • असली ग्रैंड पियानो की आवाज़ (Salamander Grand Piano)
  • नन्हे कानों के लिए कोमल: ऊँचे सुर धीमे हैं, और कई कुंजियों पर थपकी से बस कुछ ही बजते हैं
  • हर उँगली के नीचे रंगीन आतिशबाज़ी
  • बजाते समय पूरी स्क्रीन, स्टेटस बार और किनारे बाधा नहीं बनते
  • कोई विज्ञापन नहीं, कोई इन-ऐप ख़रीदारी नहीं, कोई खाता नहीं, कोई डेटा इकट्ठा नहीं, ऑफ़लाइन चलता है

  बच्चे को ऐप में रखने के लिए गाइडेड ऐक्सेस चालू करें (सेटिंग्ज़ › ऐक्सेसिबिलिटी › गाइडेड ऐक्सेस), फिर पियानो बजते समय साइड बटन तीन बार दबाएँ।

  माता-पिता: सेटिंग्ज़ पर लौटने के लिए ऊपरी दायाँ कोना 3 सेकंड दबाए रखें।

  Mac और Windows के लिए भी मुफ़्त, जहाँ यह एक फ़ालतू कीबोर्ड को ऐसे पियानो में बदल देता है जो बंद नहीं होता, ऐप नहीं बदलता और शॉर्टकट नहीं खोलता: https://mashpiano.herosizy.dev
