locales: [es-ES, es-MX]
subtitle: "Piano seguro para manitas"
keywords: "bebé,niños,infantil,teclado,juguete,música,sonido,primer,notas,colores,sensorial,calma,tocar"
promo: "Cada toque es una nota suave de piano en una escala que siempre suena bien. Sin anuncios, sin cuentas, sin internet: solo música para deditos."
whatsNew: "Ahora en 25 idiomas, según el idioma del sistema."
description: |
  Mash Piano nació de un viejo teclado mecánico que teníamos en casa. A nuestro bebé le encantaba aporrearlo, así que hicimos que tocara música.

  Dale tu iPhone o iPad a tu peque: la pantalla se convierte en filas de teclas grandes y brillantes, y cada toque suena como una nota suave de piano de cola. Todas las notas vienen de una misma escala pentatónica, así que hagan lo que hagan esas manitas, siempre suena agradable.

  • Teclas grandes y de colores que llenan la pantalla, pensadas para bebés y niños pequeños
  • Se puede tocar con todos los dedos a la vez
  • Sonido real de piano de cola (Salamander Grand Piano)
  • Suave con los oídos pequeños: las notas agudas suenan más bajo, y un manotazo sobre muchas teclas solo toca unas pocas
  • Fuegos artificiales de color con cada dedo
  • Pantalla completa mientras toca, sin barra de estado ni bordes que molesten
  • Sin anuncios, sin compras dentro de la app, sin cuentas, sin recopilar datos, funciona sin conexión

  Para que tu peque no salga de la app, activa Acceso Guiado (Ajustes › Accesibilidad › Acceso Guiado) y pulsa tres veces el botón lateral mientras suena el piano.

  Adultos: mantened pulsada la esquina superior derecha 3 segundos para volver a los ajustes.

  También gratis para Mac y Windows, donde convierte un teclado de sobra en un piano que no se cierra, no cambia de app ni abre atajos: https://mashpiano.herosizy.dev
