subtitle: "Babysikkert piano"
keywords: "baby,barn,småbarn,tastatur,leketøy,musikk,lyd,første,toner,farger,sansene,ro,trykk"
promo: "Hvert trykk er en myk pianotone i en skala som alltid høres fin ut. Ingen reklame, ingen konto, ikke noe internett: bare musikk for små fingre."
whatsNew: "Nå på 25 språk, etter systemspråket."
description: |
  Mash Piano begynte med et gammelt mekanisk tastatur hjemme. Babyen vår elsket å slå på det, så vi fikk det til å spille musikk.

  Gi iPhone eller iPad til den lille: skjermen blir rader med store, klare tangenter, og hvert trykk spiller en myk flygeltone. Alle tonene kommer fra én pentatonisk skala, så uansett hva små hender gjør, høres det alltid fint ut sammen.

  • Store fargerike tangenter som fyller skjermen, laget for babyer og småbarn
  • Spill med alle fingrene samtidig
  • Ekte flygellyd (Salamander Grand Piano)
  • Skånsomt for små ører: høye toner er svakere, og et slag på mange tangenter spiller bare noen få
  • Et fargerikt fyrverkeri under hver finger
  • Fullskjerm mens det spilles, uten statuslinje eller kanter i veien
  • Ingen reklame, ingen kjøp i appen, ingen konto, ingen datainnsamling, virker uten nett

  Hold barnet i appen med Veiledet tilgang (Innstillinger › Tilgjengelighet › Veiledet tilgang), og trykk tre ganger på sideknappen mens pianoet spiller.

  Foreldre: hold øvre høyre hjørne i 3 sekunder for å gå tilbake til innstillingene.

  Også gratis for Mac og Windows, der et ekstra tastatur blir et piano som ikke avslutter, bytter app eller åpner snarveier: https://mashpiano.herosizy.dev
