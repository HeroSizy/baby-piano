subtitle: "Bebekler için güvenli piyano"
keywords: "bebek,çocuk,yürümeye başlayan,klavye,oyuncak,müzik,ses,notalar,renkler,duyusal,sakin,dokun"
promo: "Her dokunuş, her zaman güzel duyulan bir dizide yumuşak bir piyano notası. Reklam yok, hesap yok, internet yok: minik parmaklar için sadece müzik."
whatsNew: "Artık 25 dilde, sistem diline göre."
description: |
  Mash Piano evdeki eski bir mekanik klavyeyle başladı. Bebeğimiz ona vurmayı çok seviyordu, biz de müzik çalmasını sağladık.

  iPhone’unuzu ya da iPad’inizi minik olana verin: ekran büyük, parlak tuş sıralarına dönüşür ve her dokunuş yumuşak bir kuyruklu piyano notası çalar. Bütün notalar tek bir pentatonik diziden gelir; minik eller ne yaparsa yapsın, hep hoş duyulur.

  • Ekranı dolduran büyük renkli tuşlar, bebekler ve küçük çocuklar için
  • Bütün parmaklarla aynı anda çalınabilir
  • Gerçek kuyruklu piyano sesi (Salamander Grand Piano)
  • Minik kulaklara nazik: tiz notalar daha yumuşak, birçok tuşa birden vurmak yalnızca birkaçını çalar
  • Her parmakta renkli bir havai fişek
  • Çalarken tam ekran; durum çubuğu ve kenarlar engel olmaz
  • Reklam yok, uygulama içi satın alma yok, hesap yok, veri toplanmaz, çevrimdışı çalışır

  Çocuğunuzu uygulamada tutmak için Rehberli Erişim’i açın (Ayarlar › Erişilebilirlik › Rehberli Erişim) ve piyano çalarken yan düğmeye üç kez basın.

  Ebeveynler: ayarlara dönmek için sağ üst köşeyi 3 saniye basılı tutun.

  Mac ve Windows için de ücretsiz: boştaki bir klavyeyi kapanmayan, uygulama değiştirmeyen ve kısayol açmayan bir piyanoya dönüştürür: https://mashpiano.herosizy.dev
