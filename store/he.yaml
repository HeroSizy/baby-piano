whatsNew: "עכשיו ב-25 שפות, לפי שפת המערכת."
description: |
  Mash Piano התחיל ממקלדת מכנית ישנה בבית. התינוק שלנו אהב להכות עליה, אז גרמנו לה לנגן מוזיקה.

  תנו לקטנטן את ה-iPhone או ה-iPad: המסך הופך לשורות של קלידים גדולים ובהירים, וכל נגיעה מנגנת צליל רך של פסנתר כנף. כל הצלילים מגיעים מסולם פנטטוני אחד, כך שמה שהידיים הקטנות לא יעשו, זה תמיד נשמע נעים.

  • קלידים צבעוניים גדולים שממלאים את המסך, לתינוקות ולפעוטות
  • אפשר לנגן בכל האצבעות בבת אחת
  • צליל אמיתי של פסנתר כנף (Salamander Grand Piano)
  • עדין לאוזניים קטנות: הצלילים הגבוהים שקטים יותר, ומכה על הרבה קלידים מנגנת רק כמה
  • זיקוקים צבעוניים מתחת לכל אצבע
  • מסך מלא בזמן הנגינה, בלי שורת מצב או קצוות שמפריעים
  • בלי פרסומות, בלי רכישות בתוך היישום, בלי חשבון, בלי איסוף נתונים, עובד בלי חיבור

  כדי שהילד יישאר ביישום, הפעילו גישה מודרכת (הגדרות › נגישות › גישה מודרכת) ולחצו שלוש פעמים על הכפתור הצדדי בזמן שהפסנתר מנגן.

  להורים: החזיקו את הפינה הימנית העליונה 3 שניות כדי לחזור להגדרות.

  חינם גם ל-Mac ול-Windows, שם מקלדת מיותרת הופכת לפסנתר שלא נסגר, לא מחליף יישומים ולא פותח קיצורים: https://mashpiano.herosizy.dev
