subtitle: "Piano sicuro per manine"
keywords: "neonato,bambini,bimbo,tastiera,giocattolo,musica,suono,primo,note,colori,sensoriale,calma,tocca"
promo: "Ogni tocco è una dolce nota di pianoforte, in una scala che suona sempre bene. Niente pubblicità, account o internet: solo musica per piccole dita."
whatsNew: "Ora in 25 lingue, secondo la lingua del sistema."
description: |
  Mash Piano è nato da una vecchia tastiera meccanica di casa. Al nostro bambino piaceva tantissimo batterci sopra, così l’abbiamo fatta suonare.

  Dai il tuo iPhone o iPad al tuo piccolo: lo schermo diventa file di tasti grandi e luminosi, e ogni tocco suona una morbida nota di pianoforte a coda. Tutte le note vengono da una sola scala pentatonica, quindi qualunque cosa facciano le manine, suona sempre bene.

  • Grandi tasti colorati che riempiono lo schermo, pensati per neonati e bambini piccoli
  • Si suona con tutte le dita insieme
  • Vero suono di pianoforte a coda (Salamander Grand Piano)
  • Delicato con le piccole orecchie: le note acute sono più piano, e una manata su tanti tasti ne suona solo pochi
  • Un fuoco d’artificio colorato sotto ogni dito
  • Schermo intero mentre suona, senza barra di stato né bordi tra i piedi
  • Niente pubblicità, acquisti in-app, account o raccolta dati; funziona offline

  Per tenere il bambino nell’app, attiva Accesso Guidato (Impostazioni › Accessibilità › Accesso Guidato), poi premi tre volte il tasto laterale mentre il piano suona.

  Genitori: tenete premuto l’angolo in alto a destra per 3 secondi per tornare alle impostazioni.

  Gratis anche per Mac e Windows, dove trasforma una tastiera in più in un pianoforte che non si chiude, non cambia app e non apre scorciatoie: https://mashpiano.herosizy.dev
