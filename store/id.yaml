subtitle: "Piano aman untuk tangan mungil"
keywords: "bayi,balita,anak,piano,keyboard,mainan,musik,suara,nada,warna,sensorik,tenang,ketuk"
promo: "Setiap ketukan adalah nada piano lembut dalam tangga nada yang selalu terdengar indah. Tanpa iklan, tanpa akun, tanpa internet: hanya musik untuk jari mungil."
whatsNew: "Kini dalam 25 bahasa, mengikuti bahasa sistem."
description: |
  Mash Piano berawal dari keyboard mekanik tua di rumah. Bayi kami suka sekali memukulnya, jadi kami membuatnya memainkan musik.

  Berikan iPhone atau iPad Anda kepada si kecil: layar berubah menjadi deretan tuts besar yang cerah, dan setiap ketukan memainkan nada grand piano yang lembut. Semua nada berasal dari satu tangga nada pentatonik, jadi apa pun yang dilakukan tangan mungil, selalu terdengar harmonis.

  • Tuts besar berwarna yang memenuhi layar, dibuat untuk bayi dan balita
  • Main dengan semua jari sekaligus
  • Suara grand piano asli (Salamander Grand Piano)
  • Lembut untuk telinga kecil: nada tinggi lebih pelan, dan tepukan pada banyak tuts hanya membunyikan beberapa
  • Kembang api warna-warni di bawah setiap jari
  • Layar penuh saat bermain, bar status dan tepi layar tidak mengganggu
  • Tanpa iklan, tanpa pembelian dalam app, tanpa akun, tanpa pengumpulan data, berfungsi offline

  Agar anak tetap di app, nyalakan Akses Terpandu (Pengaturan › Aksesibilitas › Akses Terpandu), lalu klik tiga kali tombol samping saat piano bermain.

  Orang tua: tahan pojok kanan atas selama 3 detik untuk kembali ke pengaturan.

  Juga gratis untuk Mac dan Windows, yang mengubah keyboard cadangan menjadi piano yang tidak bisa keluar, berpindah app, atau membuka pintasan: https://mashpiano.herosizy.dev
