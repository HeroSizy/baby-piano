subtitle: "بيانو آمن للأيدي الصغيرة"
keywords: "رضيع,طفل,أطفال,بيانو,لوحة مفاتيح,لعبة,موسيقى,صوت,نغمات"
promo: "كل لمسة نغمة بيانو هادئة في سلّم يبدو جميلًا دائمًا. بلا إعلانات ولا حسابات ولا إنترنت: موسيقى فقط للأصابع الصغيرة."
whatsNew: "الآن بـ 25 لغة، حسب لغة النظام."
description: |
  بدأ Mash Piano بلوحة مفاتيح ميكانيكية قديمة في البيت. كان طفلنا يحب أن يضربها، فجعلناها تعزف الموسيقى.

  أعطِ طفلك الـ iPhone أو الـ iPad: تتحول الشاشة إلى صفوف من المفاتيح الكبيرة الزاهية، وكل لمسة تعزف نغمة ناعمة من بيانو كبير. كل النغمات من سلّم خماسي واحد، فمهما فعلت الأيدي الصغيرة يبقى الصوت متناغمًا.

  • مفاتيح ملوّنة كبيرة تملأ الشاشة، مصممة للرضّع والأطفال الصغار
  • العزف بكل الأصابع معًا
  • صوت بيانو كبير حقيقي (Salamander Grand Piano)
  • لطيف على الآذان الصغيرة: النغمات العالية أهدأ، وضربة على مفاتيح كثيرة تعزف القليل منها فقط
  • ألعاب نارية ملوّنة تحت كل إصبع
  • ملء الشاشة أثناء العزف، دون أن يعيق شريط الحالة أو الحواف
  • بلا إعلانات ولا مشتريات داخل التطبيق ولا حسابات، ولا جمع للبيانات، ويعمل دون اتصال

  لإبقاء طفلك داخل التطبيق، شغّل الوصول الموجّه (الإعدادات › تسهيلات الاستخدام › الوصول الموجّه)، ثم اضغط الزر الجانبي ثلاث مرات أثناء عزف البيانو.

  للأهل: اضغطوا مع الاستمرار على الزاوية العلوية اليمنى 3 ثوانٍ للعودة إلى الإعدادات.

  مجاني أيضًا على Mac وWindows، حيث يحوّل لوحة مفاتيح زائدة إلى بيانو لا يُغلق ولا يبدّل التطبيقات ولا يفتح الاختصارات: https://mashpiano.herosizy.dev
