locales: [zh-Hant]
subtitle: "給寶寶小手的安全鋼琴"
keywords: "寶寶,嬰兒,幼兒,鋼琴,早教,音樂,玩具,鍵盤,兒歌,聲音,顏色,啟蒙,敲擊,感官"
promo: "每一下都是輕柔的鋼琴聲，所有音都在同一個五聲音階裡，怎麼按都好聽。沒有廣告、不用登入、不連網。"
whatsNew: "現在支援 25 種語言，跟隨系統語言自動切換。"
description: |
  Mash Piano 的靈感來自家裡一個舊機械鍵盤。寶寶特別愛拍它，於是我們讓它彈出音樂。

  把 iPhone 或 iPad 交給寶寶：螢幕變成一排排又大又亮的琴鍵，每按一下都是一聲柔和的平台鋼琴音。所有音都來自同一個五聲音階，小手怎麼亂按，聽起來都和諧。

  • 鋪滿螢幕的大彩色琴鍵，專為嬰幼兒設計
  • 可以多根手指同時彈
  • 真實平台鋼琴取樣（Salamander Grand Piano）
  • 保護小耳朵：高音更輕，一巴掌按很多鍵也只響幾個
  • 每根手指按下都會綻放一朵彩色煙火
  • 彈琴時全螢幕，狀態列和邊緣手勢不礙事
  • 無廣告、無內購、不需帳號、不收集任何資料、可離線使用

  想讓寶寶出不去：開啟「引導使用模式」（設定 › 輔助使用 › 引導使用模式），彈琴時連按三下側邊按鈕。

  家長：按住右上角 3 秒回到設定頁。

  Mac 和 Windows 也有免費版，把閒置的鍵盤變成一台不會退出、不會切換程式、不會觸發快捷鍵的鋼琴：https://mashpiano.herosizy.dev
