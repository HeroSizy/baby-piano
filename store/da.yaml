subtitle: "Babysikkert klaver"
keywords: "baby,barn,småbørn,tastatur,legetøj,musik,lyd,første,toner,farver,sanser,ro,tryk"
promo: "Hvert tryk er en blød klavertone i en skala, der altid lyder pænt. Ingen reklamer, ingen konto, intet internet: bare musik til små fingre."
whatsNew: "Nu på 25 sprog, efter systemets sprog."
description: |
  Mash Piano begyndte med et gammelt mekanisk tastatur derhjemme. Vores baby elskede at slå på det, så vi fik det til at spille musik.

  Giv din iPhone eller iPad til den lille: skærmen bliver til rækker af store, klare tangenter, og hvert tryk spiller en blød flygeltone. Alle toner kommer fra én pentatonisk skala, så uanset hvad de små hænder gør, lyder det altid rart sammen.

  • Store farverige tangenter, der fylder skærmen, lavet til babyer og småbørn
  • Spil med alle fingre på én gang
  • Ægte flygellyd (Salamander Grand Piano)
  • Skånsomt for små ører: høje toner er svagere, og et slag på mange tangenter spiller kun få
  • Et farverigt fyrværkeri under hver finger
  • Fuld skærm, mens der spilles, uden statuslinje eller kanter i vejen
  • Ingen reklamer, ingen køb i appen, ingen konto, ingen dataindsamling, virker offline

  Hold barnet i appen med Guidet adgang (Indstillinger › Tilgængelighed › Guidet adgang), og tryk tre gange på sideknappen, mens klaveret spiller.

  Forældre: hold øverste højre hjørne i 3 sekunder for at komme tilbage til indstillingerne.

  Også gratis til Mac og Windows, hvor et ekstra tastatur bliver til et klaver, der ikke lukker, skifter app eller åbner genveje: https://mashpiano.herosizy.dev
