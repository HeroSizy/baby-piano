subtitle: "เปียโนปลอดภัยสำหรับมือน้อยๆ"
keywords: "ทารก,เด็กเล็ก,เด็ก,เปียโน,คีย์บอร์ด"
promo: "ทุกการแตะคือเสียงเปียโนนุ่มๆ ในบันไดเสียงที่ไพเราะเสมอ ไม่มีโฆษณา ไม่ต้องมีบัญชี ไม่ใช้อินเทอร์เน็ต มีแค่ดนตรีสำหรับนิ้วน้อยๆ"
whatsNew: "ตอนนี้รองรับ 25 ภาษา ตามภาษาของระบบ"
description: |
  Mash Piano เริ่มจากคีย์บอร์ดแบบกลไกเก่าๆ ที่บ้าน ลูกน้อยของเราชอบตีมันมาก เราเลยทำให้มันเล่นดนตรีได้

  ยื่น iPhone หรือ iPad ให้ลูกน้อย หน้าจอจะกลายเป็นแถวคีย์ใหญ่สีสดใส และทุกการแตะจะเล่นเสียงแกรนด์เปียโนนุ่มๆ ทุกโน้ตมาจากบันไดเสียงเพนทาโทนิกเดียวกัน มือน้อยๆ จะกดอย่างไรก็ไพเราะเสมอ

  • คีย์สีสันขนาดใหญ่เต็มหน้าจอ ออกแบบมาสำหรับทารกและเด็กเล็ก
  • เล่นได้ทุกนิ้วพร้อมกัน
  • เสียงแกรนด์เปียโนจริง (Salamander Grand Piano)
  • ถนอมหูเล็กๆ: โน้ตสูงเบากว่า และตบหลายคีย์พร้อมกันก็ดังแค่ไม่กี่เสียง
  • พลุสีสันใต้ทุกนิ้ว
  • เต็มหน้าจอขณะเล่น แถบสถานะและขอบจอไม่กวนใจ
  • ไม่มีโฆษณา ไม่มีการซื้อในแอป ไม่ต้องมีบัญชี ไม่เก็บข้อมูล ใช้งานออฟไลน์ได้

  เพื่อให้ลูกอยู่ในแอป ให้เปิดการเข้าถึงที่ได้รับคำแนะนำ (การตั้งค่า › การช่วยการเข้าถึง › การเข้าถึงที่ได้รับคำแนะนำ) แล้วกดปุ่มด้านข้างสามครั้งขณะเปียโนเล่น

  ผู้ปกครอง: กดมุมขวาบนค้างไว้ 3 วินาทีเพื่อกลับไปที่การตั้งค่า

  ใช้ฟรีบน Mac และ Windows ด้วย เปลี่ยนคีย์บอร์ดที่ไม่ได้ใช้ให้เป็นเปียโนที่ไม่ปิด ไม่สลับแอป และไม่เปิดปุ่มลัด: https://mashpiano.herosizy.dev
