subtitle: "Безпечне піаніно для малят"
keywords: "малюк,дитина,дитяче,немовля,клавіатура,іграшка,музика"
promo: "Кожен дотик — м’яка нота піаніно в ладі, що завжди звучить гарно. Без реклами, без акаунтів, без інтернету: просто музика для маленьких пальчиків."
whatsNew: "Тепер 25 мовами — за мовою системи."
description: |
  Mash Piano з’явилося завдяки старій механічній клавіатурі в нас удома. Маля обожнювало по ній плескати, тож ми зробили так, щоб вона грала музику.

  Дайте маляті iPhone або iPad: екран перетворюється на ряди великих яскравих клавіш, і кожен дотик звучить м’якою нотою рояля. Усі ноти з однієї пентатоніки, тож що б не робили маленькі ручки, звучить завжди приємно.

  • Великі кольорові клавіші на весь екран — для немовлят і малят
  • Можна грати всіма пальцями одразу
  • Справжній звук рояля (Salamander Grand Piano)
  • Дбайливо до маленьких вушок: високі ноти тихіші, а плескання по багатьох клавішах грає лише кілька
  • Кольоровий феєрверк під кожним пальчиком
  • Під час гри — весь екран, рядок стану й краї не заважають
  • Без реклами, вбудованих покупок і акаунтів, без збору даних, працює офлайн

  Щоб маля не вийшло із застосунку, увімкніть Гід-доступ (Параметри › Універсальний доступ › Гід-доступ) і тричі натисніть бічну кнопку, поки грає піаніно.

  Дорослим: утримуйте правий верхній кут 3 секунди, щоб повернутися до налаштувань.

  Також безкоштовно для Mac і Windows: зайва клавіатура стає піаніно, яке не закривається, не перемикає застосунки й не відкриває скорочень: https://mashpiano.herosizy.dev
