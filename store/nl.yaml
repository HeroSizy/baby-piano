subtitle: "Babyveilige piano"
keywords: "baby,peuter,kinderen,toetsenbord,speelgoed,muziek,geluid,eerste,noten,kleuren,zintuiglijk,rust,tik"
promo: "Elke tik is een zachte pianotoon in een toonladder die altijd mooi klinkt. Geen reclame, geen account, geen internet: gewoon muziek voor kleine vingertjes."
whatsNew: "Nu in 25 talen, volgens de systeemtaal."
description: |
  Mash Piano begon met een oud mechanisch toetsenbord thuis. Onze baby sloeg er dolgraag op, dus lieten we het muziek maken.

  Geef je iPhone of iPad aan je kleintje: het scherm wordt rijen grote, heldere toetsen, en elke tik speelt een zachte vleugeltoon. Alle tonen komen uit één pentatonische toonladder, dus wat kleine handjes ook doen, het klinkt altijd prettig samen.

  • Grote kleurige toetsen die het scherm vullen, gemaakt voor baby’s en peuters
  • Speel met alle vingers tegelijk
  • Echt vleugelgeluid (Salamander Grand Piano)
  • Zacht voor kleine oortjes: hoge tonen zijn zachter, en een klap op veel toetsen speelt er maar een paar
  • Een kleurig vuurwerk onder elke vinger
  • Volledig scherm tijdens het spelen, zonder statusbalk of randen die in de weg zitten
  • Geen reclame, geen in-app-aankopen, geen account, geen gegevensverzameling, werkt offline

  Houd je kind in de app met Begeleide toegang (Instellingen › Toegankelijkheid › Begeleide toegang) en druk drie keer op de zijknop terwijl de piano speelt.

  Ouders: houd de rechterbovenhoek 3 seconden vast om terug te gaan naar de instellingen.

  Ook gratis voor Mac en Windows, waar het een reservetoetsenbord verandert in een piano die niet stopt, niet van app wisselt en geen sneltoetsen opent: https://mashpiano.herosizy.dev
