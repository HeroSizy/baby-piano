description: |
  Mash Piano begann mit einer alten mechanischen Tastatur bei uns zu Hause. Unser Baby liebte es, darauf zu hauen, also haben wir sie Musik spielen lassen.

  Gib deinem Kleinen dein iPhone oder iPad: Der Bildschirm wird zu Reihen großer, leuchtender Tasten, und jedes Tippen spielt einen weichen Flügelton. Alle Töne stammen aus einer pentatonischen Tonleiter – was die kleinen Hände auch tun, es klingt immer angenehm zusammen.

  • Große bunte Tasten, die den Bildschirm füllen, gemacht für Babys und Kleinkinder
  • Mit allen Fingern gleichzeitig spielen
  • Echter Flügelklang (Salamander Grand Piano)
  • Sanft zu kleinen Ohren: hohe Töne sind leiser, und ein Schlag auf viele Tasten spielt nur wenige
  • Ein buntes Feuerwerk unter jedem Finger
  • Vollbild beim Spielen, Statusleiste und Ränder stören nicht
  • Keine Werbung, keine In-App-Käufe, kein Konto, keine Datenerfassung, funktioniert offline

  Damit dein Kind in der App bleibt: Geführten Zugriff einschalten (Einstellungen › Bedienungshilfen › Geführter Zugriff) und beim Spielen dreimal die Seitentaste drücken.

  Eltern: die obere rechte Ecke 3 Sekunden halten, um zu den Einstellungen zurückzukehren.

  Auch kostenlos für Mac und Windows: Dort wird eine übrige Tastatur zum Klavier, das sich nicht beenden lässt, keine Apps wechselt und keine Kurzbefehle öffnet: https://mashpiano.herosizy.dev
